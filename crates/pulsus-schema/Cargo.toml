[package]
name = "pulsus-schema"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clickhouse.workspace = true
pulsus-clickhouse = { path = "../pulsus-clickhouse" }
pulsus-config = { path = "../pulsus-config" }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "time", "rt"] }
tracing.workspace = true
xxhash-rust.workspace = true
serde.workspace = true
futures.workspace = true

[dev-dependencies]
pulsus-schema-testkit = { path = "../pulsus-schema-testkit" }
# Issue #18 follow-up: the rollup level discovery the reader runs, against
# a database this crate's schema built. Dev-only; the normal graph is
# unchanged.
pulsus-read = { path = "../pulsus-read" }
# Issue #320: the shared live-gate guard for the environment-gated
# suites in this crate — with `PULSUS_TEST_CLICKHOUSE` absent they used to
# exit 0, so a CI wiring regression was silent.
pulsus-testkit = { path = "../pulsus-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Issue #743 part A: the digests that pin the render with no cold volume.
sha2.workspace = true
