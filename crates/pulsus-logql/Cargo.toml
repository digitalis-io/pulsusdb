[package]
name = "pulsus-logql"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
# Issue #523: the ONE endpoint read, `pulsus_testkit::live_endpoint`.
# This crate's reference-facing suites used a bare `env::var` and took a
# missing endpoint as a skip, so a live CI step that lost its `env:` block
# reported green having compared nothing. Dependency-free crate, dev-only.
pulsus-testkit = { path = "../pulsus-testkit" }
# Issue #392: the general-category source for `src/unicode_ident_tables.rs`.
# DEV-ONLY on purpose — the tables are committed, so the runtime
# dependency set stays `thiserror` alone. `tests/identifier_charset.rs`
# re-derives `\p{L}`/`\p{Nd}` from it and fails if the committed tables
# have drifted.
regex-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
