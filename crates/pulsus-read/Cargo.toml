[package]
name = "pulsus-read"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pulsus-logql = { path = "../pulsus-logql" }
pulsus-clickhouse = { path = "../pulsus-clickhouse" }
pulsus-config = { path = "../pulsus-config" }
# `floor_to_activity_bucket`/`DEFAULT_ACTIVITY_BUCKET_MS` (the writer/reader
# shared bucket-floor identity, issue #26 precedent) plus `LabelSet`/
# `Fingerprint`/`LabelMatcher`/`MatchOp` for the issue #30 label cache.
pulsus-model = { path = "../pulsus-model" }
# The pure planner/evaluator (issue #31): `pulsus-read::metrics::exec`
# orchestrates `pulsus_promql::plan` -> resolve/fetch -> `pulsus_promql
# ::evaluate`, the only crate in the workspace that calls into both this
# and `pulsus-model` at once (`pulsus-model -> pulsus-promql ->
# pulsus-read`, acyclic — issue #31 plan amendment §1).
pulsus-promql = { path = "../pulsus-promql" }
# Issue #328 D1: the RE2 acceptance screen (#309) moved to the shared
# pulsus-re2 crate; `metrics::re2_authority` keeps the matcher-facing
# wrappers and delegates the pattern scan.
pulsus-re2 = { path = "../pulsus-re2" }
# The TraceQL AST (issue #57): `traces::search_plan`/`traces::filter` lower
# `pulsus_traceql::Query` into the two-phase search plan — mirrors
# `pulsus-logql`'s role on the logs read path (parsing itself stays
# server-side; this crate consumes the AST only).
pulsus-traceql = { path = "../pulsus-traceql" }
# The `clickhouse` crate's `#[derive(Row)]` macro expands to paths rooted at
# `clickhouse::...` unqualified, so it must be a direct dependency of every
# crate that derives it, not just reachable transitively through
# `pulsus-clickhouse` (same pattern as `pulsus-schema`/`pulsus-write`'s
# Cargo.toml).
clickhouse.workspace = true
thiserror.workspace = true
serde.workspace = true
# `StoredSpanRow.payload` (issue #55): the stored span payload is a binary
# blob in a ClickHouse `String` column — `#[serde(with = "serde_bytes")]`
# routes the `Vec<u8>` through RowBinary's length-prefixed byte-string
# encoding instead of serde's default `Array(UInt8)` sequence encoding
# (same pattern as `pulsus-write`'s `TraceSpanRow.payload`).
serde_bytes.workspace = true
futures.workspace = true
# In-process matcher evaluation for the label cache's `Re`/`Nre` matchers
# (issue #30), bounded by a compiled-regex cache.
regex.workspace = true
# The LogQL `json` parser stage (issue M6-09, `logql::pipeline`): each
# surviving line's body is parsed once per query with the compiled
# pipeline — cost bounded to rows that already passed line-filter
# pushdown.
serde_json.workspace = true
# Go template engine (issue #230): IANA zone offsets for the `time`
# function family (`date`/`toDate`/`toDateInZone`/`__timestamp__`
# methods) — versions pinned by the existing workspace lock.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# `b64enc` (the sprig subset); decode is a hand port for Go's exact
# error offsets.
base64 = "0.22"
# Loki's `labels.StableHash` (issue #227): the same-timestamp cross-stream
# tie key in the sliding-window range evaluator is `xxhash64(seed 0)` over
# the stream's sorted `name·0xFF·value·0xFF` labels — byte-identical to
# Loki v3.7.4 (`model/labels/sharding.go`). Same `xxh64` seed-0 primitive
# `pulsus-model`/`pulsus-promql` already use for fingerprinting.
xxhash-rust.workspace = true
# The refresh loop (`spawn_refresh_loop`) and the resident snapshot slot
# (`std::sync::RwLock<Arc<CacheSnapshot>>` plus the `tokio::task::JoinHandle`
# the loop runs in) are the first async/task-spawning code in this crate
# (issue #30) — promoted from a dev-only dependency to a real one.
tokio = { workspace = true, features = ["time", "rt", "sync", "macros"] }
# `refresh.rs`'s self-healing sweep loop logs a failed sweep rather than
# clobbering the last good snapshot (architect plan) — the same
# `tracing::warn!` convention every other crate in this workspace uses.
tracing.workspace = true

[dev-dependencies]
# Issue #320: the shared live-gate guard for the environment-gated
# suites in this crate — with `PULSUS_TEST_CLICKHOUSE` absent they used to
# exit 0, so a CI wiring regression was silent.
pulsus-testkit = { path = "../pulsus-testkit" }
pulsus-schema = { path = "../pulsus-schema" }
# DEV-ONLY, and must stay dev-only (issue #167): the deferred #139 L-T1
# executor proof (`tests/traces_search_heal_live.rs`) drives the real
# `TraceWriter` + registration backfill against a live ClickHouse and
# then searches through this crate's own executor. pulsus-write's normal
# dependencies contain no pulsus-read, so the production graph stays
# unchanged and acyclic — `cargo tree -p pulsus-read -e normal` must
# never show pulsus-write.
pulsus-write = { path = "../pulsus-write" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Unique per-invocation run-database naming for the #90 query_log gates
# (strict `CREATE DATABASE`), so concurrent/repeat live runs never collide.
uuid = { version = "1", features = ["v4"] }
# DEV-ONLY (issue #221): the variants G4 census parses this crate's own
# `exec.rs`/`plan.rs` with a syntax-aware visitor (a token/regex rule
# cannot see generic calls or macro bodies). Never a production
# dependency — `cargo tree -p pulsus-read -e normal` must not show syn.
# Issue #236 §4.1's token census and AC 7's call-site census in
# `tests/logql_metric_agg_golden.rs` are the other two consumers: the
# latter counts CALL EXPRESSIONS, so respelling a call site cannot move
# a published count the way a substring census let it.
sha2.workspace = true
syn = { version = "=2.0.118", default-features = false, features = ["full", "parsing", "visit", "clone-impls", "printing"] }
proc-macro2 = "1"
