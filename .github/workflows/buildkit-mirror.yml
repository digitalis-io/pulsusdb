# Issue #704: a copy of the build image that docker/setup-buildx-action
# starts, on the registry this repository already publishes to, so the e2e
# jobs and the release workflow can pull it by digest instead of pulling
# anonymously from the public registry, which once refused the pull. Those
# jobs switch to the copy once this has run.
#
# Run by hand only. Copies one pinned digest of moby/buildkit:buildx-stable-1;
# the last step prints the copy's digest, which is what the workflows pin.
# To move to a newer build image, change the source digest, run this, and
# update the pins.
name: buildkit-mirror

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the pinned build image
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/digitalis-io/buildkit:buildx-stable-1
          docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Print the copy's digest
        run: docker buildx imagetools inspect ghcr.io/digitalis-io/buildkit:buildx-stable-1
