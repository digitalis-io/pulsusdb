  # The required check `schema-it-cluster`: it passes only when all three
  # cluster jobs above passed, and fails when any failed, was cancelled or
  # was skipped.
  schema-it-cluster:
    if: always()
    needs: [schema-it-cluster-c1, schema-it-cluster-c2, schema-it-cluster-c3]
    runs-on: ubuntu-latest
    steps:
      - name: All three cluster jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "cluster jobs: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
  # Issue #7: e2e harness skeleton. Both legs build the local `pulsusdb:e2e`
  # image once via buildx (GHA layer cache, so the image build itself is
  # fast on both legs) then hand the whole stack lifecycle — up, poll
  # `/ready`, run scenarios, down — to `pulsus-e2e`, the same binary local
  # development runs against Podman. Since issue #33, this also gates the
  # M2 differential-accuracy scenario at its `ci` (~1k series) tier
  # (`PULSUS_E2E_METRICS_SCALE` defaults to `ci` — `e2e/src/metrics.rs`);
  # the ~10k `full` tier is `e2e-metrics-full` below.
  # Issue #602 part 3b-1: the edge job under steady ingest, on a runner of
  # its own. It loads the whole cluster for sixteen minutes, so it neither
  # shares the runner with another case nor lengthens `schema-it-cluster`.
  schema-it-cluster-lv1:
    runs-on: ubuntu-latest
    steps:
      # Issue #602 part 3b-1: the runner's size, so a load-bound case such as
      # `the_job_keeps_up_under_steady_ingest` can be read against it.
      - name: Runner size
        run: |
          nproc
          free -g

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start the 2-shard cluster
        run: docker compose -f ci/clickhouse-cluster/compose.yaml up -d

      - name: Wait for cluster health
        run: |
          for _ in $(seq 1 60); do
            h1=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard1-it 2>/dev/null || echo starting)
            h1b=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard1b-it 2>/dev/null || echo starting)
            h2=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard2-it 2>/dev/null || echo starting)
            hk=$(docker inspect -f '{{.State.Health.Status}}' pulsus-keeper-it 2>/dev/null || echo starting)
            if [ "$h1" = healthy ] && [ "$h1b" = healthy ] && [ "$h2" = healthy ] && [ "$hk" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::cluster did not become healthy in time"
          docker ps -a
          exit 1

      # The clustered half of `schema/schema.sh`, created rather than
      # rendered. **This is the only leg that can tell a correct replication
      # path from the silently broken one**: a path whose `{shard}` macro was
      # substituted away reaches the same validation point as a correct one
      # on a single node, and the difference only shows against a keeper —
      # every shard joins one replica set. So the check is not "the DDL
      # applied" but what the macros resolved to, read back from
      # `system.replicas` per shard.
      - name: "schema.sh: builds the clustered schema on both shards"
        env:
          CLICKHOUSE_SERVER: localhost
          CLICKHOUSE_HTTP_PORT: "18123"
          CLICKHOUSE_DB: pulsus
          PULSUS_RETENTION_DAYS: "7"
          PULSUS_CLUSTER: pulsus_test_cluster
        run: |
          ask() { curl -sS --fail-with-body "http://localhost:$1/" --data-binary "$2"; }
          schema/schema.sh

          catalogue() {
            ask "$1" "SELECT name, create_table_query FROM system.tables \
                      WHERE database = 'pulsus' ORDER BY name FORMAT TSV"
          }
          catalogue 18123 > /tmp/cluster-shard1.tsv
          catalogue 13123 > /tmp/cluster-shard1b.tsv
          catalogue 28123 > /tmp/cluster-shard2.tsv
          objects=$(wc -l < /tmp/cluster-shard1.tsv)
          if [ "$objects" -ne 95 ]; then
            echo "::error::expected 95 objects in the clustered schema, got $objects"
            cut -f1 /tmp/cluster-shard1.tsv
            exit 1
          fi
          if ! diff -u /tmp/cluster-shard1.tsv /tmp/cluster-shard2.tsv; then
            echo "::error::ON CLUSTER did not land the identical DDL on both shards"
            exit 1
          fi
          if ! diff -u /tmp/cluster-shard1.tsv /tmp/cluster-shard1b.tsv; then
            echo "::error::ON CLUSTER did not land the identical DDL on shard 1's second replica"
            exit 1
          fi

          # Per-shard replica sets must be per shard: `{shard}` resolved to
          # this node's own macro, so shard 1's paths say /1/ and shard 2's
          # say /2/. Shard 1 has two replicas (issue #599 part B), so its
          # 27 per-shard tables hold two and shard 2's hold one. The eight
          # cluster-wide tables take /all/ and hold all three nodes. A
          # substituted-away macro collapses the first group onto one path
          # with three replicas, which this catches.
          paths() {
            ask "$1" "SELECT countIf(zookeeper_path LIKE '/clickhouse/tables/$2/%'), \
                             countIf(zookeeper_path LIKE '/clickhouse/tables/all/%'), \
                             countIf(total_replicas = 1), countIf(total_replicas = 2), \
                             countIf(total_replicas = 3) \
                      FROM system.replicas WHERE database = 'pulsus' FORMAT TSV"
          }
          for pair in "18123 1 27_8_0_27_8" "13123 1 27_8_0_27_8" "28123 2 27_8_27_0_8"; do
            set -- $pair
            want=$(printf '%s' "$3" | tr '_' '\t')
            got=$(paths "$1" "$2")
            echo "node on $1: per-shard/all/one/two/three-replica = $got"
            if [ "$got" != "$want" ]; then
              echo "::error::shard on $1 resolved its replication paths as '$got', expected '$want'"
              ask "$1" "SELECT table, zookeeper_path, total_replicas FROM system.replicas \
                        WHERE database = 'pulsus' ORDER BY table FORMAT TSV"
              exit 1
            fi
          done

      - name: The edge job keeps up under steady ingest (cluster)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        run: cargo test -p pulsus-read --test traces_nested_set_cluster -- --show-output --exact the_job_keeps_up_under_steady_ingest

      - name: Tear down the cluster
        if: always()
        run: docker compose -f ci/clickhouse-cluster/compose.yaml down -v

  # Issue #798: the clustered trace suite on ClickHouse 26.10.2.103. That
  # server refused the service-graph refresh at planning (`TOO_BIG_AST`)
  # while every job here ran the 26.8 floor. Same fixture, with the three
  # servers' image laid over by `compose.26.10.yaml`.
  schema-it-cluster-26-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start the 2-shard cluster on 26.10
        run: docker compose -f ci/clickhouse-cluster/compose.yaml -f ci/clickhouse-cluster/compose.26.10.yaml up -d

      - name: Wait for cluster health
        run: |
          for _ in $(seq 1 60); do
            h1=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard1-it 2>/dev/null || echo starting)
            h1b=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard1b-it 2>/dev/null || echo starting)
            h2=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard2-it 2>/dev/null || echo starting)
            hk=$(docker inspect -f '{{.State.Health.Status}}' pulsus-keeper-it 2>/dev/null || echo starting)
            if [ "$h1" = healthy ] && [ "$h1b" = healthy ] && [ "$h2" = healthy ] && [ "$hk" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::cluster did not become healthy in time"
          docker ps -a
          exit 1

      - name: Every server is 26.10.2.103
        run: |
          for svc in ch-shard1 ch-shard1b ch-shard2; do
            v=$(docker compose -f ci/clickhouse-cluster/compose.yaml -f ci/clickhouse-cluster/compose.26.10.yaml \
                  exec -T "$svc" clickhouse-client -q 'SELECT version()')
            echo "$svc: $v"
            if [ "$v" != "26.10.2.103" ]; then
              echo "::error::$svc runs $v, expected 26.10.2.103"
              exit 1
            fi
          done

      - name: Nested-set search and the service graph on 26.10 (cluster)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        # `--test-threads=5`: the clock-case batch holds one thread asleep;
        # the other tests keep the runner's 4.
        run: cargo test -p pulsus-read --test traces_nested_set_cluster -- --show-output --test-threads=5 --skip the_job_keeps_up_under_steady_ingest

      - name: Tear down the cluster
        if: always()
        run: docker compose -f ci/clickhouse-cluster/compose.yaml -f ci/clickhouse-cluster/compose.26.10.yaml down -v

  # Issue #7: e2e harness skeleton. Both legs build the local `pulsusdb:e2e`
  # image once via buildx (GHA layer cache, so the image build itself is
  # fast on both legs) then hand the whole stack lifecycle — up, poll
  # `/ready`, run scenarios, down — to `pulsus-e2e`, the same binary local
  # development runs against Podman. Since issue #33, this also gates the
  # M2 differential-accuracy scenario at its `ci` (~1k series) tier
  # (`PULSUS_E2E_METRICS_SCALE` defaults to `ci` — `e2e/src/metrics.rs`);
  # the ~10k `full` tier is `e2e-metrics-full` below.
  e2e-single:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=ghcr.io/digitalis-io/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build pulsusdb:e2e
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: pulsusdb:e2e
          load: true
          cache-from: type=gha,scope=pulsusdb-e2e
          cache-to: type=gha,mode=max,scope=pulsusdb-e2e

      - name: Run the single-node e2e harness
        run: cargo run -p pulsus-e2e -- --variant single --engine docker

      # Issue #33: the metrics-differential scenario dumps a minimal repro
      # (query, mode, window, both raw responses) to
      # `target/e2e-artifacts/metrics-diff/<variant>/` on any mismatch —
      # never an allowlist (docs/features.md §7 AC). Uploaded only on
      # failure so a green run carries no extra CI artifact weight.
      - name: Upload metrics-differential mismatch artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-single-metrics-diff-artifacts
          path: target/e2e-artifacts/**
          if-no-files-found: ignore

  e2e-cluster:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=ghcr.io/digitalis-io/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build pulsusdb:e2e
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: pulsusdb:e2e
          load: true
          cache-from: type=gha,scope=pulsusdb-e2e
          cache-to: type=gha,mode=max,scope=pulsusdb-e2e

      - name: Run the 2-shard cluster e2e harness
        run: cargo run -p pulsus-e2e -- --variant cluster --engine docker

      - name: Upload metrics-differential mismatch artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cluster-metrics-diff-artifacts
          path: target/e2e-artifacts/**
          if-no-files-found: ignore

  # Issue #33: the literal docs/features.md §7 "10k series" acceptance
  # criterion — a green run of both variants at the `full` tier is #33's
  # own closure evidence, then continuously re-validated nightly/on
  # dispatch (the `ci` tier above gates every PR; correctness is
  # scale-invariant, so this leg is evidence-gathering, not per-PR
  # protection — same split as issue #16's `bench-cluster`).
  e2e-metrics-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: ci
    strategy:
      matrix:
        variant: [single, cluster]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=ghcr.io/digitalis-io/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build pulsusdb:e2e
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: pulsusdb:e2e
          load: true
          cache-from: type=gha,scope=pulsusdb-e2e
          cache-to: type=gha,mode=max,scope=pulsusdb-e2e

      - name: Run the ${{ matrix.variant }} e2e harness (full 10k-series differential tier)
        env:
          PULSUS_E2E_METRICS_SCALE: full
          # Issue #60 AC3: the traces scenarios' full tier rides this
          # same nightly/dispatch job (per-PR legs run the `ci` tier
          # default); the single leg exercises the Tempo differential at
          # full scale, the cluster leg the native roundtrip.
          PULSUS_E2E_TRACES_SCALE: full
          # Issue M6-09 plan v2 delta A + issue #204: the LogQL-pipeline
          # differential (`logs_pipeline_differential`) is nightly/dispatch-
          # tier and self-gates on this flag (printing a skip on per-PR runs;
          # no per-PR gate, no new job). This flag is exported to BOTH matrix
          # variants, so the differential now runs on single AND cluster: the
          # single leg drives the full pinned-reference oracle differential,
          # the cluster leg runs ORACLE-LESS (`logs::oracle_present`) —
          # PulsusDB(cluster) == the by-construction corpus, proving shard
          # fan-out with no lost/duplicated rows (the cluster overlay ships no
          # reference store; parity is inherited from the single leg). The SM
          # differential stays single-only (needs the compat push endpoint).
          PULSUS_E2E_LOGS_DIFFERENTIAL: "1"
          PULSUS_E2E_LOGS_SCALE: full
        run: cargo run -p pulsus-e2e -- --variant ${{ matrix.variant }} --engine docker

      - name: Upload metrics-differential evidence/mismatch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-metrics-full-${{ matrix.variant }}-artifacts
          path: target/e2e-artifacts/**
          if-no-files-found: ignore

  # Issue #236 §5/AC 25: the post-aggregation allocation witness' LARGE
  # SCALE cell. The per-PR `ci` job runs the whole
  # `logql_post_agg_witness` binary at CI scale (10^3-10^4); this leg adds
  # the `#[ignore]`d cell at `MAX_METRIC_RESULT_POINTS / 8` points, which
  # extends the range over which `measured peak <= modelled bytes` is an
  # OBSERVED property to ~10^6. Same trigger condition as
  # `e2e-metrics-full` above: scale-invariant gates protect every PR, this
  # one gathers evidence.
  logql-post-agg-witness-scale:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"

      - name: Large-scale post-aggregation witness cell
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cargo test -p pulsus-read --test logql_post_agg_witness -- \
            --ignored --nocapture --test-threads=1 \
            zz_large_scale_cell_stays_inside_the_model

  # Issue #262 (AC 7): the ONLY gate that measures the shipped
  # configuration — release frames on a pinned 2 MiB stack (tokio's worker
  # default), for each of the fifteen shapes whose abort floors were
  # measured for that issue. Each shape is a pair: it must survive
  # `parse -> plan -> evaluate` at `MAX_EXPR_DEPTH`, and the same shape at
  # depth 4,000 must overflow, so the positive leg cannot pass because
  # frames got smaller rather than because the cap holds.
  #
  # Nightly/dispatch only, and the reason is not budget: there is no
  # `--release` leg anywhere else in this file, and in a DEBUG build the
  # positive legs abort at depth 250 (debug's worst-shape floor is 70), so
  # this cannot ride the `ci` job. A PR can therefore go green without the
  # production margin having been measured — stated here rather than
  # papered over with a debug-profile gate that would prove nothing about
  # a 2 MiB release binary.
  promql-depth-stack-release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"

      - name: PromQL depth-cap pinned-stack gate (release, 2 MiB)
        env:
          CARGO_INCREMENTAL: "0"
          PULSUS_PROMQL_DEPTH_STACK: "1"
        run: |
          cargo test --release -p pulsus-promql --test promql_depth_stack -- \
            --nocapture --test-threads=1

  # Issue #16, docs/schemas.md §9's two-tier model, Tier 1 distributed leg:
  # captures per-shard system.query_log + EXPLAIN PIPELINE evidence for the
  # logs-family shard-locality claims (docs/schemas.md §7,
  # docs/architecture.md risks table) on the 4-shard fixture
  # (ci/bench-cluster/compose.yaml, extends ci/clickhouse-cluster/'s
  # 2-shard pattern). Manual-dispatch-only (task-manager resolution #4 on
  # issue #16): the scale-invariant gates already run per-PR on single-node
  # (schema-it-logql, above); this leg is evidence-gathering, not per-PR
  # protection — promote to a nightly `schedule` if/when regressions
  # actually appear here.
  bench-cluster:
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"

      - name: Start the 4-shard bench cluster
        run: docker compose -f ci/bench-cluster/compose.yaml up -d

      - name: Wait for cluster health
        run: |
          for _ in $(seq 1 60); do
            h1=$(docker inspect -f '{{.State.Health.Status}}' pulsus-bench-shard1 2>/dev/null || echo starting)
            h2=$(docker inspect -f '{{.State.Health.Status}}' pulsus-bench-shard2 2>/dev/null || echo starting)
            h3=$(docker inspect -f '{{.State.Health.Status}}' pulsus-bench-shard3 2>/dev/null || echo starting)
            h4=$(docker inspect -f '{{.State.Health.Status}}' pulsus-bench-shard4 2>/dev/null || echo starting)
            hk=$(docker inspect -f '{{.State.Health.Status}}' pulsus-bench-keeper 2>/dev/null || echo starting)
            if [ "$h1" = healthy ] && [ "$h2" = healthy ] && [ "$h3" = healthy ] && [ "$h4" = healthy ] && [ "$hk" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::cluster did not become healthy in time"
          docker ps -a
          exit 1

      - name: Run the M1 logs read-path benchmark (--dist)
        run: |
          cargo run -p xtask -- bench logs-read --dist \
            --http-url http://127.0.0.1:18123 --database pulsus_bench_dist \
            --cluster pulsus_bench_cluster \
            --profile ci --seed 42 --services 50 --streams 500 \
            --lines-per-sec 200 --duration-secs 3600 --reps 5 \
            --out docs/benchmarks/data/logs-read-dist.json \
            --report-out /tmp/logs-read-dist.md

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: logs-read-dist-evidence
          path: |
            docs/benchmarks/data/logs-read-dist.json
            /tmp/logs-read-dist.md

      - name: Tear down the cluster
        if: always()
        run: docker compose -f ci/bench-cluster/compose.yaml down -v

  # Issue #600: every corpus and `catalogue-extra.tsv` query through the
  # shipped route, each search answer compared with the independent
  # interpreter, as is each metrics answer, range and instant.
  # Scheduled or dispatched, not required.
  traceql-catalogue:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The digest is `schema-it-traceql`'s, for the reason given there.
      - name: Start ClickHouse 26.8
        run: |
          docker run -d --name pulsus-ch-catalogue -p 19123:8123 \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/users.d/network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro \
            clickhouse/clickhouse-server@sha256:d3fd302416d9523d5d64239d5713d1c16c20ecea2045ac70d7e941b376cb266e
          for _ in $(seq 1 30); do
            curl -sf http://localhost:19123/ping && break
            sleep 1
          done

      - name: Build pulsusdb and xtask
        run: cargo build -p pulsus-server --bin pulsusdb -p xtask --bin xtask

      - name: The catalogue against the shipped compiler (T-C8, T-Q2)
        run: sh docs/TraceQL/measure/catalogue.sh localhost 19123 catalogue "$RUNNER_TEMP/catalogue" target/debug

  # Issue #600 part 2: the catalogue on the two-shard cluster, shard 1 with
  # two replicas, run through each shard's node. Scheduled or dispatched,
  # not required.
  traceql-catalogue-cluster:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start the 2-shard cluster
        run: docker compose -f ci/clickhouse-cluster/compose.yaml up -d

      - name: Wait for cluster health
        run: |
          for _ in $(seq 1 60); do
            h1=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard1-it 2>/dev/null || echo starting)
            h1b=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard1b-it 2>/dev/null || echo starting)
            h2=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard2-it 2>/dev/null || echo starting)
            hk=$(docker inspect -f '{{.State.Health.Status}}' pulsus-keeper-it 2>/dev/null || echo starting)
            if [ "$h1" = healthy ] && [ "$h1b" = healthy ] && [ "$h2" = healthy ] && [ "$hk" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::cluster did not become healthy in time"
          docker ps -a
          exit 1

      - name: Build pulsusdb and xtask
        run: cargo build -p pulsus-server --bin pulsusdb -p xtask --bin xtask

      - name: One base time
        run: echo "CATALOGUE_BASE=$(( ( $(date -u +%s) - 7200 ) / 60 * 60 ))" >> "$GITHUB_ENV"

      - name: The catalogue on one node
        run: sh docs/TraceQL/measure/catalogue.sh localhost 18123 catalogue_single "$RUNNER_TEMP/catalogue-0" target/debug

      - name: The catalogue through shard 1's node
        env:
          PULSUS_CLUSTER: pulsus_test_cluster
        run: sh docs/TraceQL/measure/catalogue.sh localhost 18123 catalogue "$RUNNER_TEMP/catalogue-1" target/debug

      - name: The catalogue through shard 2's node
        env:
          PULSUS_CLUSTER: pulsus_test_cluster
        run: sh docs/TraceQL/measure/catalogue.sh localhost 28123 catalogue "$RUNNER_TEMP/catalogue-2" target/debug

      - name: One answer through every entry point
        run: python3 docs/TraceQL/measure/catalogue_same.py "$RUNNER_TEMP"/catalogue-0/catalogue-run.jsonl "$RUNNER_TEMP"/catalogue-1/catalogue-run.jsonl "$RUNNER_TEMP"/catalogue-2/catalogue-run.jsonl

      - name: Tear down the cluster
        if: always()
        run: docker compose -f ci/clickhouse-cluster/compose.yaml down -v

  # Issue #213: the release workflow's packaging scripts, tested on every
  # pull request because the release workflow itself runs only on a tag or by
  # hand. Appended last so no earlier line of this file moves.
  release-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Release packaging scripts self-test
        run: ci/checks/release_packaging_self_test.sh
