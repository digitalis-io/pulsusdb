              exit 1
            fi
          done

      # Issue #18 part B: a rollup level's run row is read with its data
      # from one replica's answer, so a replica that lacks a new part
      # cannot cover it.
      - name: Live metrics rollup cluster tests
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        run: cargo test -p pulsus-read --test live_metrics_rollup_cluster

      # Issue #778 part 1: the read cache's replica-lag gate, with fetches
      # stopped on shard 1's second replica.
      - name: Live read cache cluster tests
