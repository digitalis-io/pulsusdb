            got=$(paths "$1" "$2")
            echo "node on $1: per-shard/all/one/two/three-replica = $got"
            if [ "$got" != "$want" ]; then
              echo "::error::shard on $1 resolved its replication paths as '$got', expected '$want'"
              ask "$1" "SELECT table, zookeeper_path, total_replicas FROM system.replicas \
                        WHERE database = 'pulsus' ORDER BY table FORMAT TSV"
              exit 1
            fi
          done

      # Issue #549: the grouped instant read over the distributed sample
      # tables. The statement reads both `_dist` tables inside one
      # statement through a literal fingerprint list, which is what keeps
      # it out of the forms `distributed_product_mode` refuses; this step
      # is what stops that becoming true only in one session's notes.
      - name: Grouped instant read over the distributed sample tables (cluster)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_CLUSTER: "pulsus_test_cluster"
        run: cargo test -p pulsus-read --test live_metrics_grouped_cluster

      # Issue #594 part 2: a nested-set search over the distributed span and
      # per-trace tables. The statement reads `spans_dist` inside
      # `spans_dist` and `traces_dist` inside `traces_dist`, which the
      # default `distributed_product_mode` refuses; the search sends
      # `'local'` for it. The negative control pins the refusal (288), the
      # positive cases the answers over traces split across both shards.
      # The suite also holds the service graph's cluster cases (#599); its
      # output shows each edge-job run's duration (part B §4).
      # `the_job_keeps_up_under_steady_ingest` runs alone in the
      # `schema-it-cluster-lv1` job (issue #602 part 3b-1).
      - name: Nested-set search over the distributed tables (cluster)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        # `--test-threads=5`: the clock-case batch holds one thread asleep;
        # the other tests keep the runner's 4.
        run: cargo test -p pulsus-read --test traces_nested_set_cluster -- --show-output --test-threads=5 --skip the_job_keeps_up_under_steady_ingest

      # Issue #738: the tenant rows check, single-node and clustered.
      - name: Trace tenant rows (cluster)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "18123"
          PULSUS_TEST_CH_CLUSTER: "pulsus_test_cluster"
        run: cargo test -p pulsus-read --test traces_tenant_rows

      # Issue #823: the merged flame graph over the distributed sample table,
      # the samples split across both shards, in one statement.
      - name: Merged flame graph over the distributed tables (cluster)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        run: cargo test -p pulsus-read --test profiles_tree_cluster

      # Issue #824: the time series over the distributed entry and series
      # tables, the series split across both shards, in one statement.
      - name: Profile time series over the distributed tables (cluster)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        run: cargo test -p pulsus-read --test profiles_series_cluster

      # Issue #827: the diff over the distributed sample and series tables,
      # one side's samples split across both shards, in one statement.
      - name: Profile diff over the distributed tables (cluster)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        run: cargo test -p pulsus-read --test profileql_diff_cluster

      # Issue #43: cross-node connection spreading over the two DISTINCT real
      # nodes (SHARD1/SHARD2 default to the fixture IPs 172.28.0.11/12:8123),
      # proving the pool selects both nodes and fails over off a dead port,
      # plus AC7's SERVER-side proof (run-unique log_comment read back from
      # each node's system.query_log) that marked queries actually landed on
      # both — the authoritative multi-node proof the single-node schema-it
      # leg cannot give.
      - name: Cross-node connection spreading (two real nodes)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        run: cargo test -p pulsus-clickhouse --test live_spreading

      # Issue #803: each read request goes to one server, requests take
      # turns over both nodes, a request whose server drops runs again on
      # another, and writes keep to the node this process's zone prefers.
      - name: Reads spread, writes keep to the preferred zone (two nodes)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        run: cargo test -p pulsus-clickhouse --test live_read_spread

      - name: Tear down the cluster
        if: always()
        run: docker compose -f ci/clickhouse-cluster/compose.yaml down -v

  # Issue #843 part 2: the `schema-it-cluster` suites in three jobs, each
