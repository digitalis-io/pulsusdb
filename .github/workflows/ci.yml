        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        run: cargo test -p pulsus-schema --test live_cluster

      # Issue #494 part 1: a landing insert goes through its table's routing
      # wrapper, keyed on the push's receive stamp, so a push and every
      # resend of it reach one shard whichever server receives them.
      - name: Live routed landing insert (cluster)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
        run: cargo test -p pulsus-write --test live_cluster_landing

      # Issue #136: the metrics SqlFallback fetch's double-distributed
      # `fingerprint IN (SELECT … FROM metric_series_dist …)` shape, denied
