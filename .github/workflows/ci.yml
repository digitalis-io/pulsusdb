      - name: Log patterns ingest fidelity gate
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test log_patterns_fidelity

      # Issue #54 AC5: the OTLP traces round-trip — POST /v1/traces ->
      # TraceWriter (sync) -> exact count()s on both writer-written trace
      # tables, plus a live payload/FixedString wire-encoding read-back.
      # Reuses this job's ClickHouse 24.8 container.
      - name: Traces ingest round-trip (exact counts)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test trace_ingest_roundtrip

      # Issue #270: OTLP/JSON metrics ingest must store the CORRECTLY ROUNDED
      # f64 — POST /v1/metrics (application/json) -> decode_json -> parse ->
      # MetricWriter (sync) -> ClickHouse, read back as
      # reinterpretAsUInt64(value). The literals are chosen so serde_json's
      # default parser and str::parse disagree by 1 ULP, so this step fails if
      # the workspace `float_roundtrip` feature is ever dropped.
      # Reuses this job's ClickHouse 24.8 container.
      - name: OTLP/JSON metrics ingest stores nearest-representable f64 bits
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test metric_ingest_float_roundtrip

      # Issue #75: the Zipkin v2 JSON ingest round-trip — ingest_zipkin ->
      # zipkin::to_otlp -> otlp_traces::parse -> TraceWriter (sync) ->
      # ClickHouse. Proves fingerprint identity (Zipkin summary columns
      # byte-identical to the equivalent OTLP ingest) and shared-span
      # storage (a shared RPC span stores both the SERVER and CLIENT sides).
      # Reuses this job's ClickHouse 24.8 container.
      - name: Zipkin v2 JSON ingest round-trip (fingerprint identity + shared span)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test zipkin_ingest_roundtrip

      # Issue #120 (M7-A4): the native-histogram write path — MetricWriter ->
      # metric_hist_samples. Deciding ClickHouse-NaN gate (finite/stale-NaN/
      # absent-NaN `sum` bit patterns survive Float64 RowBinary round-trip
      # distinctly — also the first live proof of the landed float-stale
      # assumption), an OTLP parse(Native) -> writer -> SELECT absolute-count
      # round-trip incl. an internal zero bucket, and the value_type
      # discriminator mask (a cross-request float+histogram at one series
      # registers both metric_series rows, groupBitOr == 3). Reuses this
      # job's ClickHouse 24.8 container.
      - name: Native histogram writer round-trip (NaN gate + value_type)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test live_metric_hist_writer

      # Issue #140: remote-write native-histogram ingest — a real snappy
      # prompb body with a GAUGE-hint and an UNKNOWN-hint integer native
      # histogram through ingest_remote_write (sync) -> MetricWriter ->
      # ClickHouse: counter_reset_hint lands 3 and 0 respectively, the
      # stored row decodes to a Gauge FloatHistogram, and the
      # histograms-only series register value_type = 1 metric_series rows.
      # Reuses this job's ClickHouse 24.8 container.
      - name: Remote-write gauge-hint native histogram (counter_reset_hint e2e)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test live_remote_write_hist

      # Issue #134: the log_streams registration-backfill live failure
      # injection — L1 "lost registration" (first streams insert swallowed
      # with a deterministic error; the backfill heals it and the
      # stage-1-shaped query resolves the fingerprint in the sample's
      # month) and L2 "false Poisoned" (the first insert genuinely lands;
      # the backfill's duplicate re-insert provably occurs and collapses
      # to one row on a FINAL read — no inflation). Reuses this job's
      # ClickHouse 24.8 container.
      - name: Log stream registration backfill (live L1/L2 failure injection)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test live_log_stream_backfill

      # Issue #139: the metric registration-backfill live failure
      # injection — L-M1 (first metric_series insert swallowed; the
      # sample is visible while the registration is absent, then the
      # backfill heals it and the LIMIT 1 BY lookup is byte-identical
      # across a forced duplicate re-insert) and L-M2 (metric_metadata
      # "false Poisoned": the backfill's genuine duplicate plus a stale
      # re-insert both collapse to one FINAL row whose survivor is the
      # max-updated_ns descriptor). Reuses this job's ClickHouse 24.8
      # container.
      - name: Metric registration backfill (live L-M1/L-M2 failure injection)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test live_metric_registration_backfill

      # Issue #139: the trace_attrs_idx registration-backfill live
      # failure injection — L-T1 (attrs insert swallowed while the span
      # commits: the span is fetchable by trace_id but the index probe
      # finds nothing; after the heal the primary-key probe returns the
      # trace_id, the span matches, and a forced duplicate collapses to
      # FINAL count 1). The TraceQL-executor end-to-end proof is the
      # #167 step below. Reuses this job's ClickHouse 24.8 container.
      - name: Trace attr-index registration backfill (live L-T1 failure injection)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test live_trace_attr_backfill

      # Issue #167: the deferred #139 L-T1 executor proof — the same
      # deterministic failure injection (attrs insert swallowed, backfill
      # re-inserts parked on a closed heal gate), proven through
      # pulsus-read's REAL TraceQL pipeline: pre-heal the span is
      # fetchable by trace id yet invisible to an attribute-scoped
      # search; post-heal the IDENTICAL SearchPlan (whose single
      # generator targets trace_attrs_idx) finds it. Reuses this job's
      # ClickHouse 24.8 container.
      - name: Trace attr-search heal end-to-end (live #167 executor proof)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test traces_search_heal_live

      # Issue #34: the M2 label-resolution benchmark's `--profile ci` smoke
      # step — reproducibility + a committed CI-scale evidence artifact
      # only (task-manager resolution #2: no asserted `system.query_log`
      # ratio gate here, a follow-up once the report shows which ratios are
      # stable). `--profile ci` hard-codes a fixed, small cardinality set
      # ([1_000, 10_000, 50_000]) and rejects any `--metric-cardinalities`
      # override, so this step can never silently run the 5M-series
      # design-target shape in CI. Reuses this job's ClickHouse 24.8
      # container.
      - name: M2 metrics-labels benchmark (--profile ci smoke)
        run: |
          cargo run -p xtask -- bench metrics-labels \
            --http-url http://127.0.0.1:19123 --database pulsus_bench_metrics_ci \
            --profile ci --seed 42 --reps 3 --matcher-reps 200 \
            --out docs/benchmarks/data/metrics-labels-ci.json \
            --report-out /tmp/metrics-labels-ci.md

      - name: Upload M2 metrics-labels evidence
        uses: actions/upload-artifact@v4
        with:
          name: metrics-labels-ci-evidence
          path: |
            docs/benchmarks/data/metrics-labels-ci.json
            /tmp/metrics-labels-ci.md

      # Issue #35: the late-label-hydration `--profile ci` smoke step —
      # reproducibility + a committed CI-scale evidence artifact only (same
      # posture as #34's M2 step above: no asserted `system.query_log`
      # ratio gate here). `--profile ci` hard-codes the fixed
      # `[1_000, 10_000]` breadth set and rejects any `--breadths`
      # override, so this step never silently runs the 50,000-breadth
      # verdict-evaluation shape in CI (that is `--profile full`,
      # manual-only — see docs/benchmarks/m1-logs-late-hydration.md's
      # reproduction section). Reuses this job's ClickHouse 24.8 container.
      - name: M1 late-hydration benchmark (--profile ci smoke)
        run: |
          cargo run -p xtask -- bench logs-hydration \
            --http-url http://127.0.0.1:19123 --database pulsus_bench_hydration_ci \
            --profile ci --seed 42 \
            --out docs/benchmarks/data/logs-hydration-ci.json \
            --report-out /tmp/logs-hydration-ci.md

      - name: Upload M1 late-hydration evidence
        uses: actions/upload-artifact@v4
        with:
          name: logs-hydration-ci-evidence
          path: |
            docs/benchmarks/data/logs-hydration-ci.json
            /tmp/logs-hydration-ci.md

      # Live API/engine suites — every env-gated suite runs here; new issues
