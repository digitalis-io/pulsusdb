name: CI

on:
  pull_request:
  # No `push: branches: [main]` trigger: per-PR CI (above) is the authoritative
  # gate — every change lands via a PR that runs the full per-PR suite before
  # merge — so re-running the identical suite on the post-merge `main` commit is
  # pure redundant compute. `main` health is instead validated by the nightly
  # `schedule` below (which also runs the full differential tiers). Keep PRs
  # up-to-date with `main` before merge (branch protection) so the PR run
  # reflects the true post-merge state.
  # Issue #16: lets the manual-dispatch-only `bench-cluster` job (below) be
  # triggered on demand — the scale-invariant gates already run per-PR on
  # single-node (`schema-it`); the 4-shard leg is evidence-gathering, not
  # per-PR protection (task-manager resolution #4 on issue #16).
  workflow_dispatch:
  # Issue #33 amendment: keeps the literal docs/features.md §7 "10k
  # series" acceptance criterion continuously validated after #33's own
  # closure evidence (a green `e2e-metrics-full` run, both variants) —
  # per-PR CI continues to gate at the `ci` (~1k series) tier inside
  # `e2e-single`/`e2e-cluster` below; correctness is scale-invariant, so
  # the nightly/dispatch-only full tier is evidence-gathering, not per-PR
  # protection (same "PR gate vs. nightly reference profile" split as
  # issue #16's `bench-cluster`).
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"

      # Issue #87: pinned nextest for structured (JUnit) test output — the
      # summarizer steps below feed $GITHUB_STEP_SUMMARY. Bump the pin
      # deliberately; `latest` would make CI drift.
      - name: Install cargo-nextest (pinned)
        run: curl -LsSf https://get.nexte.st/0.9.140/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Issue #156: the upstream promqltest corpus is no longer vendored —
      # the test driver fetches it once from the pinned Prometheus commit,
      # verifies it against the committed upstream-manifest.json, and
      # caches it. Restoring the cache here keeps warm runs fully hermetic
      # (zero network); a cold run (pin bump / evicted key) fetches once
      # and the post-job save repopulates the key. No restore-keys: the
      # cache is keyed by the manifest, and old-pin entries live in
      # sha-keyed subdirs that would only be dead weight.
      - name: Cache promqltest upstream corpus (pinned fetch, issue #156)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pulsusdb/promqltest
          key: promqltest-testdata-v1-${{ hashFiles('crates/pulsus-promql/tests/promqltest/corpus/upstream/upstream-manifest.json') }}

      # Issue #87: same test set as `cargo test --workspace` (this is where
      # the hermetic conformance/drift suites — route_inventory and the
      # api_conformance/manifest unit halves — run), now via nextest so the
      # per-suite results land in the run summary. A failing test fails
      # this step exactly as before (ci/test-summary.sh propagates
      # nextest's exit code untouched).
      - name: Test
        run: ci/test-summary.sh run workspace --workspace

      # Issue #87 review adjudication: the hermetic conformance/drift
      # suites get their own named summary rows alongside the aggregate
      # `workspace` row above. These two steps re-run suites the workspace
      # step already ran — an accepted double-run costing seconds (both
      # binaries are already built; api_conformance's live tests
      # env-gate-skip here, its hermetic half is what's being surfaced).
      # `!cancelled()` (round-2 review): they still run — and still fail
      # the job on failure, no continue-on-error — when the aggregate
      # workspace step above is red, exactly the runs where per-suite
      # visibility matters most.
      - name: Route-inventory drift guard (dedicated summary row)
        if: '!cancelled()'
        run: ci/test-summary.sh run route_inventory -p pulsus-server --test route_inventory

      - name: API conformance, hermetic half (dedicated summary row)
        if: '!cancelled()'
        run: ci/test-summary.sh run api_conformance_hermetic -p pulsus-server --test api_conformance

      # nextest never runs doctests; keep them covered separately so the
      # switch above changes reporting only, never what runs.
      - name: Doctests
        run: cargo test --workspace --doc

      # Issue #87: per-suite results table on every run, pass or fail. The
      # summarizer never fails a green run — generation problems are
      # warnings only.
      - name: Write test results summary
        if: always()
        run: ci/test-summary.sh render

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ci
          path: target/test-summary/
          if-no-files-found: ignore


  # Issue #5: every DDL block in docs/schemas.md must be rendered and
  # executed against a fresh ClickHouse in CI. Single-node 24.8 leg (live
  # migration/MV tests, the `--mode init` create-then-no-op acceptance
  # criterion) plus a negative leg proving the < 24.8 version refusal.
  # Uses the runner's own docker (task-manager resolution #3 on issue #5);
  # local development uses podman against the same runtime-neutral fixtures.

  # Issue #335 B0: the wire baseline's freeze gates, in their OWN job.
  #
  # It began as step 3 of `ci`, which was wrong twice over. Its failure
  # skipped every later step, so a re-pin PR got no fmt, no clippy and no
  # tests; and because every other job declares `needs: ci`, a red `ci`
  # also skipped the four e2e/schema jobs. A PR touching the baseline
  # therefore lost its ENTIRE signal — and the downstream
  # `no such command: nextest` errors read as infrastructure noise rather
  # than as this gate firing on exactly the change it was built to catch.
  #
  # As its own job it blocks nothing else: `ci` and the e2e legs run and
  # report normally, and this reports red on its own. There is
  # deliberately no opt-out marker — a marker is a box that anyone
  # editing the baseline quietly would also tick, which is the behaviour
  # the gate exists to prevent.
  #
  # ISSUE #335 STAGE C — the baseline is DIRECTIONAL, not immutable.
  #
  # Gate 3 used to fail on any movement, so a legitimate improvement
  # merged with this job red "by human override". That taught the next
  # reader that the freeze is negotiable, which is the failure mode plan
  # v10 named. It is now a rule with a direction, which is not a
  # loosening:
  #
  #   the baseline may move only toward FEWER divergences — never toward
  #   more, and never by a probe that agreed on `origin/main` diverging
  #   here.
  #
  # Why a decrease is safe to allow. The freeze exists to stop a POISONED
  # baseline: numbers measured after a change, so broken code agrees with
  # itself. A decrease cannot express that — it is strictly more
  # agreement with the reference, and the reference column is
  # `matrix.json`'s, which this job reads from `origin/main` and which
  # the hermetic
  # `accept_surface.rs::the_reference_column_is_frozen_against_silent_re_pinning`
  # digest independently forbids a PR to move. Only OUR side can move
  # here, and only toward the oracle. An increase stays forbidden and is
  # exactly what the freeze catches.
  #
  # The clauses are complementary, per plan v5: the per-probe clause
  # blocks the compensating swap (two probes trading places leaves every
  # total right), and the totals clause bounds what the per-probe one
  # cannot see — a probe ADDED to the baseline already diverging has no
  # prior state to move from.
  #
  # THE PROBE KEY, and why the first version of this rule was bypassable
  # (Stage C review). A probe's identity is its `query` string, and the
  # first cut both trusted that field to be stable and used list LENGTH
  # as set cardinality. That let a PR substitute probes: delete an
  # agreeing probe A, add a duplicate of a diverging probe B, then
  # improve B and regress A. Nothing "moved" — A was simply not there to
  # be looked at — and the length was unchanged, so both clauses passed
  # while the baseline quietly lost A's coverage. The key is therefore
  # treated as a SET, not a list:
  #
  #   * every key on `origin/main` must still be present at HEAD, so a
  #     rename, a replacement or a deletion is a failure, not a silence;
  #   * keys must be unique at HEAD, so a duplicate cannot pad the count
  #     back up;
  #   * both divergence totals are computed BY THE JOIN, from the probe
  #     data and the oracle, never from `length` and never from the
  #     committed constants (which are separately checked to move in the
  #     same direction);
  #   * the oracle is `origin/main`'s `matrix.json`, WITH NO FALLBACK to
  #     this branch's. A probe with no reference row on main is
  #     unscoreable and fails. The first cut fell back to HEAD's matrix
  #     for unknown keys, which let a PR add a diverging probe together
  #     with the reference row that scores it — a PR picking its own
  #     oracle, which is exactly what this rule denies. The deliberate
  #     consequence: adding a probe and moving the baseline cannot be the
  #     same PR. Land the probe with its oracle row, then move the
  #     baseline.
  #   * duplicate probe keys fail in EVERY file a join is built from —
  #     this branch's baseline, origin/main's baseline, and both
  #     matrices. `jq`'s `from_entries` keeps the LAST value for a
  #     repeated key without complaining, so a duplicate does not break
  #     the join, it silently decides it; a check that covers three of
  #     the four inputs leaves the fourth deciding.
  #
  # STATED EDGE: the totals are scored with origin/main's oracle column
  # for every key main knows. A deliberate ORACLE re-pin (the reference
  # container re-measured, `REFERENCE_DIGEST` moved) can therefore make
  # this job red even though our side did not regress. That is the
  # intended behaviour — an oracle move is exactly when a human should
  # look — and it is written down here rather than discovered.
  #
  # Gates 2 (no source alongside creation), 4 (ordering — no source
  # before the baseline exists) and the hermetic re-derivation are
  # untouched by this and still stand exactly as B0 left them.
  wire-baseline-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wire-baseline freeze gates (issue 335 B0, direction rule Stage C)
        run: |
          set -u
          BASELINE=crates/pulsus-traceql/tests/accept_surface/wire_baseline.json
          MATRIX=crates/pulsus-traceql/tests/accept_surface/matrix.json
          CHANGED=$(git diff --name-only origin/main...HEAD)
          SRC=$(printf '%s\n' "$CHANGED" \
            | grep -E '^crates/.+/src/|(^|/)build\.rs$|^Cargo\.lock$|(^|/)Cargo\.toml$|^rust-toolchain\.toml$' || true)
          if git cat-file -e origin/main:"$BASELINE" 2>/dev/null; then
            if [ -n "$(git diff --name-only origin/main...HEAD -- "$BASELINE")" ]; then
              # The baseline moved. It may only have moved toward fewer
              # divergences. Both "before" sides come from origin/main —
              # the baseline it is measured against AND the oracle column
              # it is scored with — so nothing this PR contains can
              # decide its own verdict here.
              TMP=$(mktemp -d)
              git show origin/main:"$BASELINE" > "$TMP/old_baseline.json"
              git show origin/main:"$MATRIX" > "$TMP/old_matrix.json"

              # Clause 0, the KEY SET. Everything below joins on the probe
              # query, so the join has to be total and one-to-one before
              # any verdict computed through it means anything. `jq`'s
              # from_entries silently keeps the LAST value for a repeated
              # key, so a duplicate does not error — it quietly decides
              # which row wins. Both sides of the join are checked.
              DUPLICATED=$(jq -r '
                [ .wire_baseline[].query ] | group_by(.)
                | map(select(length > 1) | .[0]) | .[]' "$BASELINE")
              if [ -n "$DUPLICATED" ]; then
                echo "::error::the wire baseline has duplicate probe keys — a probe's query IS its identity here, and a duplicate can pad the probe count back up after a deletion (issue 335 Stage C direction rule):"
                printf '%s\n' "$DUPLICATED"
                exit 1
              fi
              DUP_OLD_BASELINE=$(jq -r '
                [ .wire_baseline[].query ] | group_by(.)
                | map(select(length > 1) | .[0]) | .[]' "$TMP/old_baseline.json")
              if [ -n "$DUP_OLD_BASELINE" ]; then
                echo "::error::origin/main's wire_baseline.json has duplicate probe keys — the \$before map the MISSING and REGRESSED clauses join on would silently keep one row per key (issue 335 Stage C direction rule):"
                printf '%s\n' "$DUP_OLD_BASELINE"
                exit 1
              fi
              DUP_ORACLE=$(jq -r '
                [ .accept_surface_probes[].query ] | group_by(.)
                | map(select(length > 1) | .[0]) | .[]' "$TMP/old_matrix.json")
              if [ -n "$DUP_ORACLE" ]; then
                echo "::error::origin/main's matrix.json has duplicate probe keys — the oracle map this gate joins on would silently keep one row per key (issue 335 Stage C direction rule):"
                printf '%s\n' "$DUP_ORACLE"
                exit 1
              fi
              DUP_HEAD_ORACLE=$(jq -r '
                [ .accept_surface_probes[].query ] | group_by(.)
                | map(select(length > 1) | .[0]) | .[]' "$MATRIX")
              if [ -n "$DUP_HEAD_ORACLE" ]; then
                echo "::error::this branch's matrix.json has duplicate probe keys — the same silent last-wins join feeds the hermetic wire suite (issue 335 Stage C direction rule):"
                printf '%s\n' "$DUP_HEAD_ORACLE"
                exit 1
              fi
              MISSING=$(jq -r --slurpfile new "$BASELINE" '
                ([ $new[0].wire_baseline[].query ]
                   | map({key: ., value: true}) | from_entries) as $have
                | [ .wire_baseline[].query | select(($have[.] // false) | not) ]
                | .[]' "$TMP/old_baseline.json")
              if [ -n "$MISSING" ]; then
                echo "::error::the wire baseline dropped probes present on origin/main — renaming, replacing or deleting a probe retires whatever it was showing; every origin/main key must still be present (issue 335 Stage C direction rule):"
                printf '%s\n' "$MISSING"
                exit 1
              fi
              # THE ORACLE IS origin/main's, WITH NO FALLBACK. Every probe
              # in the baseline must have a reference verdict THERE; a
              # probe whose only oracle row is on this branch is
              # unscoreable and fails. An earlier cut fell back to HEAD's
              # matrix for keys main did not know, which handed a PR the
              # ability to add a diverging probe together with the
              # reference row that scores it — the very thing the
              # "both before-sides come from origin/main" rule exists to
              # deny (Stage C review, [medium]).
              #
              # The consequence is deliberate: ADDING a probe and MOVING
              # the baseline cannot happen in one PR. Land the probe with
              # its oracle row first, then move the baseline.
              UNJOINABLE=$(jq -r \
                --slurpfile omtx "$TMP/old_matrix.json" '
                  ($omtx[0].accept_surface_probes
                     | map({key: .query, value: .reference}) | from_entries) as $oref
                  | [ .wire_baseline[].query | select($oref[.] == null) ]
                  | .[]' "$BASELINE")
              if [ -n "$UNJOINABLE" ]; then
                echo "::error::wire baseline probes with no reference verdict on origin/main — the oracle comes from origin/main with no fallback, so a probe added in this PR cannot be scored by a reference row this PR also supplies; land the probe first, move the baseline after (issue 335 Stage C direction rule):"
                printf '%s\n' "$UNJOINABLE"
                exit 1
              fi

              # Clause 1, per probe: nothing that AGREED on origin/main
              # may diverge here. Scored against origin/main's reference
              # column, never this PR's.
              REGRESSED=$(jq -r \
                --slurpfile old "$TMP/old_baseline.json" \
                --slurpfile mtx "$TMP/old_matrix.json" '
                  ($mtx[0].accept_surface_probes
                     | map({key: .query, value: .reference}) | from_entries) as $ref
                  | ($old[0].wire_baseline
                     | map({key: .query, value: .pulsus_wire}) | from_entries) as $before
                  | [ .wire_baseline[]
                      | select(($ref[.query] != null) and ($before[.query] != null))
                      | select($before[.query] == $ref[.query] and .pulsus_wire != $ref[.query])
                      | .query ]
                  | .[]' "$BASELINE")
              if [ -n "$REGRESSED" ]; then
                echo "::error::the wire baseline moved the WRONG WAY — these probes agreed with the reference on origin/main and diverge here; the baseline may only move toward fewer divergences (issue 335 Stage C direction rule):"
                printf '%s\n' "$REGRESSED"
                exit 1
              fi

              # Clause 2, the totals — DERIVED BY THE JOIN, from the probe
              # data and the oracle, never from `length` and never from the
              # committed constants. Bounds what clause 1 cannot see: a
              # probe added here has no prior state to move from.
              OLD_DERIVED=$(jq -r --slurpfile mtx "$TMP/old_matrix.json" '
                ($mtx[0].accept_surface_probes
                   | map({key: .query, value: .reference}) | from_entries) as $ref
                | [ .wire_baseline[]
                    | select($ref[.query] != null)
                    | select(.pulsus_wire != $ref[.query]) ] | length' "$TMP/old_baseline.json")
              NEW_DERIVED=$(jq -r --slurpfile omtx "$TMP/old_matrix.json" '
                ($omtx[0].accept_surface_probes
                   | map({key: .query, value: .reference}) | from_entries) as $ref
                | [ .wire_baseline[] | select(.pulsus_wire != $ref[.query]) ]
                | length' "$BASELINE")
              if [ "$NEW_DERIVED" -gt "$OLD_DERIVED" ]; then
                echo "::error::the wire baseline's derived divergence count rose ($OLD_DERIVED -> $NEW_DERIVED) — the baseline may only move toward fewer divergences (issue 335 Stage C direction rule)"
                exit 1
              fi
              # The committed constants must move the same way as the data
              # they claim to summarise.
              OLD_DIVERGE=$(jq -r '.WIRE_DIVERGE_BASELINE' "$TMP/old_baseline.json")
              NEW_DIVERGE=$(jq -r '.WIRE_DIVERGE_BASELINE' "$BASELINE")
              if [ "$NEW_DIVERGE" -gt "$OLD_DIVERGE" ]; then
                echo "::error::the wire baseline's committed WIRE_DIVERGE_BASELINE rose ($OLD_DIVERGE -> $NEW_DIVERGE) — the baseline may only move toward fewer divergences (issue 335 Stage C direction rule)"
                exit 1
              fi
              KEYS=$(jq -r '[ .wire_baseline[].query ] | unique | length' "$BASELINE")
              echo "wire baseline moved toward agreement: derived diverge $OLD_DERIVED -> $NEW_DERIVED (committed $OLD_DIVERGE -> $NEW_DIVERGE) over $KEYS unique probe keys, every origin/main key still present, none regressed"
            fi
          else
            if printf '%s\n' "$CHANGED" | grep -qx "$BASELINE"; then
              if [ -n "$SRC" ]; then
                echo "::error::the wire baseline may only be created by a PR with no source, build-script, manifest or toolchain change (crates/**/src/** at any depth, any build.rs, Cargo.lock, any Cargo.toml, rust-toolchain.toml) — issue 335 B0 no-source gate"
                exit 1
              fi
            fi
            if [ -n "$SRC" ]; then
              echo "::error::source change before the wire baseline exists on origin/main — Stage B work may not merge before B0 (issue 335 ordering gate)"
              exit 1
            fi
          fi

  schema-it:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Issue #87: pinned nextest (same pin as the `ci` job) for the
      # API-suite steps' structured output below.
      - name: Install cargo-nextest (pinned)
        run: curl -LsSf https://get.nexte.st/0.9.140/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Start ClickHouse 24.8
        run: |
          docker run -d --name pulsus-ch-schema-it -p 19123:8123 -p 19000:9000 \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/users.d/network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro \
            clickhouse/clickhouse-server:24.8
          for _ in $(seq 1 30); do
            curl -sf http://localhost:19123/ping && break
            sleep 1
          done

      - name: Live schema tests (single-node, migrations + MVs + crash/retry)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-schema --test live_schema

      # Issue #113 (M7-A2): native-histogram storage schema — migrations 23–26
      # apply + idempotent (no MigrationDrift), metric_hist_samples +
      # metric_series.value_type exist, an EXPLAIN indexes=1 metric_name-led PK
      # prune on metric_hist_samples matching the metric_samples gate, and a
      # native-histogram row round-trips losslessly for both an exponential and
      # an NHCB sample. Reuses this job's 24.8 container.
      - name: Live native-histogram schema tests (migrations + EXPLAIN + round-trip)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-schema --test live_hist_schema

      # Issue #53: traces-family tables + tag-catalog MV, retention-change
      # propagation, and the two docs/schemas.md §4.2 EXPLAIN gates on a
      # seeded ≥100k-row corpus (EXPLAIN indexes=1 + query_log.projections —
      # `EXPLAIN projections=1` is 25.x-only). Reuses this job's 24.8
      # container.
      - name: Live traces schema tests (tables + MV + EXPLAIN gates)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-schema --test live_traces

      # Issue #11: docs/schemas.md §9's "EXPLAIN indexes = 1 output for the
      # canonical queries is snapshot-tested" gate for the LogQL read path —
      # reuses this job's ClickHouse 24.8 container verbatim.
      - name: LogQL EXPLAIN indexes gate
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test explain_indexes

      # Issue #171 (M7-C3): the `/api/logs/v1/patterns` Tier-1 gate — the
      # `(fingerprint, bucket_ns, pattern)` PK prefix time-key pruning (narrow
      # window selects fewer granules than the fingerprint's total) and daily
      # partition pruning, plus the end-to-end `PatternSeries` assembly.
      - name: Log patterns EXPLAIN + engine gate
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test patterns_explain

      # Issue #55: the trace-by-ID point read's EXPLAIN primary-key gate
      # (PrimaryKey block keyed on trace_id, granules pruned) on a seeded
      # 100k-trace corpus, plus the TraceEngine fetch round-trip. Reuses
      # this job's ClickHouse 24.8 container.
      - name: Trace point-read EXPLAIN gate
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test traces_point_read

      # Issue #180/#185 (M7-TQ1/TQ6): the black-box TraceQL differential
      # oracle. ONE UNMODIFIED, digest-pinned grafana/tempo v3.0.2 serves
      # BOTH the syntax leg (observes only HTTP status) and the compare()
      # VALUE leg (issue #185/#189). The augmented `tempo-compare.yaml`
      # config adds the OTLP HTTP receiver (:4318) + the local-blocks
      # metrics processor with aggressive ingest flush so freshly-pushed
      # spans become compare()-queryable within the test's bounded poll —
      # without affecting the syntax leg. No Tempo source is copied. The
      # hermetic `ci` job runs both tests with their gates off, skipping.
      - name: Start Tempo v3.0.2 (differential oracle)
        run: |
          docker run -d --name pulsus-tempo-diff -p 13200:3200 -p 4318:4318 \
            -v "$GITHUB_WORKSPACE"/ci/tempo/tempo-compare.yaml:/etc/tempo/tempo.yaml:ro \
            grafana/tempo@sha256:aa8df8d069f77b82e978464daf55169bb8d135852ad58700aa96880653c3d8f7 \
            -config.file=/etc/tempo/tempo.yaml
          for _ in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:13200/ready)" = "200" ] && break
            sleep 1
          done
          curl -sf http://localhost:13200/ready

      - name: TraceQL Tempo differential leg (syntax)
        env:
          PULSUSDB_TEMPO_DIFF_URL: "http://localhost:13200"
          # Issue #328: the semantic validator's container capture,
          # re-verified live against the same pinned oracle. FAIL-CLOSED:
          # `require_live_gate` panics if this env block is dropped in
          # this job (the #320 class), so an absent capture cannot
          # report green.
          PULSUSDB_TEMPO_VECTORS: "1"
        run: cargo test -p pulsus-traceql --test tempo_differential

      # Issue #335: the parser accept-surface audit. Replays the whole
      # precedence / operand-position probe matrix against the SAME
      # digest-pinned oracle and asserts every recorded reference verdict
      # still holds, so a divergence can only be added or closed
      # deliberately. Runs before the legs that push spans into the
      # container: the recorded verdicts were captured against both an
      # empty and a populated store and are stable either way, but keeping
      # the syntax legs first keeps that independence obvious.
      - name: TraceQL parser accept-surface audit (oracle leg)
        env:
          PULSUSDB_TEMPO_DIFF_URL: "http://localhost:13200"
        run: cargo test -p pulsus-traceql --test accept_surface

      # Issue #185/#189 (M7-TQ6): the compare() VALUE differential, ENFORCED
      # (non-skipped). Pushes fixture OTLP spans to the reference's :4318
      # receiver, waits for them to become metrics-queryable, then asserts
      # byte-parity of compare()'s statusMessage / rootName / rootServiceName
      # values against PulsusDB (over this job's ClickHouse 24.8 on 19123).
      - name: TraceQL Tempo differential leg (compare values)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
          PULSUSDB_COMPARE_DIFF_URL: "http://localhost:13200"
          PULSUSDB_COMPARE_OTLP_URL: "http://localhost:4318"
        run: cargo test -p pulsus-read --test compare_value_differential

      # Issue #193: the by()/coalesce() grouped-response VALUE differential,
      # ENFORCED (non-skipped). Reuses the SAME digest-pinned tempo v3.0.2
      # oracle: pushes fixture spans to :4318, then asserts grouped /
      # coalesced spanSet-array parity (per-trace group-tuple set + per-group
      # span-id membership + attributes typing) against PulsusDB's real
      # search executor over this job's ClickHouse 24.8 on 19123.
      - name: TraceQL Tempo differential leg (by()/coalesce grouping)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
          PULSUSDB_GROUPING_DIFF_URL: "http://localhost:13200"
          PULSUSDB_GROUPING_OTLP_URL: "http://localhost:4318"
        run: cargo test -p pulsus-read --test traces_search_grouping_differential

      - name: Stop Tempo differential oracle
        if: always()
        run: docker rm -f pulsus-tempo-diff || true

      # Issue #191 (M8-LQ0): the black-box LogQL differential oracle. ONE
      # UNMODIFIED, digest-pinned v3.7.4 reference container serves the syntax
      # leg (observes only HTTP status at /loki/api/v1/query_range — or
      # /loki/api/v1/query for the registry's instant-only constructs, issue
      # #221; the mounted config enables approx_topk so its probe is
      # conclusive). Every registry probe's live accept/reject verdict is
      # pinned against the recorded `oracle` disposition; a supported∧reject
      # is RED. No upstream source is copied. The hermetic `ci` job runs the
      # same test with its gate off, skipping.
      - name: Start LogQL v3.7.4 reference (differential oracle)
        run: |
          docker run -d --name pulsus-logql-diff -p 13100:3100 \
            -v "$GITHUB_WORKSPACE"/ci/logql/config.yaml:/etc/loki/local-config.yaml:ro \
            grafana/loki@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc \
            -config.file=/etc/loki/local-config.yaml
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:13100/ready)" = "200" ] && break
            sleep 1
          done
          curl -sf http://localhost:13100/ready

      - name: LogQL differential leg (syntax)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-logql --test logql_differential

      # Issue #248: the nested-`ip()` accept/reject matrix — every
      # position an `ip()` label filter can occupy x both operators x
      # well-formed and malformed patterns, put to this container and
      # compared against the verdicts committed in the test. Status only,
      # no pushes: the disposition is decided before a line is read. The
      # hermetic half (PulsusDB's own verdict at parse -> plan -> compile,
      # and the pre-#248 rule replayed over the same matrix) runs in the
      # `ci` job with the gate off.
      - name: LogQL differential leg (nested ip() matrix, issue #248)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logql_nested_ip_matrix

      # Issue #339: the keyword case-folding table. Its verdicts were
      # CAPTURED from this same container (which keywords fold, which
      # token classes are case-sensitive); this leg replays them so the
      # capture cannot silently rot. The hermetic half of the file runs
      # in the `ci` job with the gate off.
      - name: LogQL differential leg (keyword case folding)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-logql --test case_folding

      # Issue #287 (fix round 3): the `| json` key-name capture drift leg.
      # Re-pushes every probe of tests/fixtures/json_key_sanitization/
      # capture.json to this job's reference container and asserts the
      # fresh responses derive the same labels as the committed artifact,
      # so the artifact provably stays a capture, not a hand-written
      # expectation (regenerating it is separately gated on a container
      # reporting exactly the pinned v3.7.4; since the oracle bump this
      # leg runs against that same v3.7.4 image). **This is the only leg
      # that compares VALUES against the container — every other leg on
      # this container compares HTTP status alone.**  Runs after the
      # syntax leg so the pushed streams cannot precede it.
      - name: LogQL json key capture drift leg (issue #287)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logql_json_key_sanitization

      # corpus-counts: none (ci-replay-leg)
      # Issue #352 step 3: the LogQL corpus replay. Takes each reachable
      # corpus case's `load` to this same reference and compares its
      # answer against the committed expectation, so a capture that goes
      # STALE is caught rather than trusted forever. NIGHTLY/dispatch
      # only: drift is a property of time passing, not of the commit
      # under test, and the leg makes a sequential push per reachable
      # row.
      #
      # It verifies VALUES; it does not verify provenance markers — it
      # reads them to decide which rows it may compare. Only some of the
      # rows the markers permit are physically reachable; the gap is
      # enumerated by reason in the test, dominated by the template rows
      # pinned to an absolute date the reference will not serve. The
      # figures live on REACHABLE / PROVENANCE_PERMITS in
      # logqltest_replay.rs, which assert them against the corpus, and
      # are deliberately not restated here: a hand-copied count beside a
      # machine-checked figure drifts (issue #248 found a stale copy in
      # round after round — this comment, the test's own module doc, and
      # PROVENANCE.md). The `corpus-counts: none` marker above makes that
      # rule enforceable rather than advisory; see
      # `check_f_marked_regions_state_no_corpus_count`.
      # corpus-counts: end (ci-replay-leg)
      - name: LogQL corpus replay leg (issue #352, nightly)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logqltest_replay

      - name: Stop LogQL differential oracle
        if: always()
        run: docker rm -f pulsus-logql-diff || true

      # Issue #43: multi-endpoint connection spreading + transport-failure
      # failover on ONE node — both SHARD endpoints point at this job's
      # 19123 server (spreading observable via per-endpoint selection
      # counts), and the failover case adds a dead port to prove demotion.
      # The cross-node proof runs on the schema-it-cluster leg below.
      - name: Connection spreading + failover (single-node)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_SHARD1_HOST: "localhost"
          PULSUS_TEST_CH_SHARD1_HTTP_PORT: "19123"
          PULSUS_TEST_CH_SHARD2_HOST: "localhost"
          PULSUS_TEST_CH_SHARD2_HTTP_PORT: "19123"
        run: cargo test -p pulsus-clickhouse --test live_spreading

      # Issue #16, docs/schemas.md §9's two-tier model, Tier 1: the
      # scale-invariant system.query_log ratio gate for the logs read path
      # (CI-scale corpus). Reuses this job's ClickHouse 24.8 container.
      - name: LogQL query_log ratio gate (Tier 1)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test query_log_gates

      # Issue #35 (full-shape parse bound): the live regression witness —
      # a >256 KiB rendered stage2/sample_fetch_multi SQL text fails to
