name: CI

on:
  pull_request:
  # No `push: branches: [main]` trigger: per-PR CI (above) is the authoritative
  # gate — every change lands via a PR that runs the full per-PR suite before
  # merge — so re-running the identical suite on the post-merge `main` commit is
  # pure redundant compute. `main` health is instead validated by the nightly
  # `schedule` below (which also runs the full differential tiers). Keep PRs
  # up-to-date with `main` before merge (branch protection) so the PR run
  # reflects the true post-merge state.
  # Issue #16: lets the manual-dispatch-only `bench-cluster` job (below) be
  # triggered on demand — the scale-invariant gates already run per-PR on
  # single-node (`schema-it`); the 4-shard leg is evidence-gathering, not
  # per-PR protection (task-manager resolution #4 on issue #16).
  workflow_dispatch:
  # Issue #33 amendment: keeps the literal docs/features.md §7 "10k
  # series" acceptance criterion continuously validated after #33's own
  # closure evidence (a green `e2e-metrics-full` run, both variants) —
  # per-PR CI continues to gate at the `ci` (~1k series) tier inside
  # `e2e-single`/`e2e-cluster` below; correctness is scale-invariant, so
  # the nightly/dispatch-only full tier is evidence-gathering, not per-PR
  # protection (same "PR gate vs. nightly reference profile" split as
  # issue #16's `bench-cluster`).
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"

      # Issue #87: pinned nextest for structured (JUnit) test output — the
      # summarizer steps below feed $GITHUB_STEP_SUMMARY. Bump the pin
      # deliberately; `latest` would make CI drift.
      - name: Install cargo-nextest (pinned)
        run: curl -LsSf https://get.nexte.st/0.9.140/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # Issue #278: an issue can carry named remaining work while the
      # defect it was filed on is fixed, and merging with "Closes #N" in
      # the body then takes that work down with the thread. The manifest
      # in ci/issues-that-must-stay-open.txt says which issues that
      # applies to and why.
      #
      # The self-test runs UNCONDITIONALLY and is the committed red path
      # for the matcher itself — a bare "no listed issue would be closed"
      # on a push tells you nothing about whether the matcher still
      # works. The scan runs on pull_request only, because that is the
      # only event with a body to read. PR_BODY arrives through the
      # environment, never shell-substituted: it is untrusted text.
      - name: Premature-close matcher self-test
        run: ci/no-premature-close.sh --self-test

      - name: Issues that must stay open
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ci/no-premature-close.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Issue #156: the upstream promqltest corpus is no longer vendored —
      # the test driver fetches it once from the pinned Prometheus commit,
      # verifies it against the committed upstream-manifest.json, and
      # caches it. Restoring the cache here keeps warm runs fully hermetic
      # (zero network); a cold run (pin bump / evicted key) fetches once
      # and the post-job save repopulates the key. No restore-keys: the
      # cache is keyed by the manifest, and old-pin entries live in
      # sha-keyed subdirs that would only be dead weight.
      - name: Cache promqltest upstream corpus (pinned fetch, issue #156)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pulsusdb/promqltest
          key: promqltest-testdata-v1-${{ hashFiles('crates/pulsus-promql/tests/promqltest/corpus/upstream/upstream-manifest.json') }}

      # Issue #87: same test set as `cargo test --workspace` (this is where
      # the hermetic conformance/drift suites — route_inventory and the
      # api_conformance/manifest unit halves — run), now via nextest so the
      # per-suite results land in the run summary. A failing test fails
      # this step exactly as before (ci/test-summary.sh propagates
      # nextest's exit code untouched).
      - name: Test
        run: ci/test-summary.sh run workspace --workspace

      # Issue #87 review adjudication: the hermetic conformance/drift
      # suites get their own named summary rows alongside the aggregate
      # `workspace` row above. These two steps re-run suites the workspace
      # step already ran — an accepted double-run costing seconds (both
      # binaries are already built; api_conformance's live tests
      # env-gate-skip here, its hermetic half is what's being surfaced).
      # `!cancelled()` (round-2 review): they still run — and still fail
      # the job on failure, no continue-on-error — when the aggregate
      # workspace step above is red, exactly the runs where per-suite
      # visibility matters most.
      - name: Route-inventory drift guard (dedicated summary row)
        if: '!cancelled()'
        run: ci/test-summary.sh run route_inventory -p pulsus-server --test route_inventory

      - name: API conformance, hermetic half (dedicated summary row)
        if: '!cancelled()'
        run: ci/test-summary.sh run api_conformance_hermetic -p pulsus-server --test api_conformance

      # nextest never runs doctests; keep them covered separately so the
      # switch above changes reporting only, never what runs.
      - name: Doctests
        run: cargo test --workspace --doc

      # Issue #87: per-suite results table on every run, pass or fail. The
      # summarizer never fails a green run — generation problems are
      # warnings only.
      - name: Write test results summary
        if: always()
        run: ci/test-summary.sh render

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ci
          path: target/test-summary/
          if-no-files-found: ignore


  # Issue #5: every DDL block in docs/schemas.md must be rendered and
  # executed against a fresh ClickHouse in CI. Single-node 26.3 leg (live
  # migration/MV tests, the `--mode init` create-then-no-op acceptance
  # criterion) plus a negative leg proving the < 26.3 version refusal.
  # Uses the runner's own docker (task-manager resolution #3 on issue #5);
  # local development uses podman against the same runtime-neutral fixtures.

  # Issue #335 B0: the wire baseline's freeze gates, in their OWN job.
  #
  # It began as step 3 of `ci`, which was wrong twice over. Its failure
  # skipped every later step, so a re-pin PR got no fmt, no clippy and no
  # tests; and because every other job declares `needs: ci`, a red `ci`
  # also skipped the four e2e/schema jobs. A PR touching the baseline
  # therefore lost its ENTIRE signal — and the downstream
  # `no such command: nextest` errors read as infrastructure noise rather
  # than as this gate firing on exactly the change it was built to catch.
  #
  # As its own job it blocks nothing else: `ci` and the e2e legs run and
  # report normally, and this reports red on its own. There is
  # deliberately no opt-out marker — a marker is a box that anyone
  # editing the baseline quietly would also tick, which is the behaviour
  # the gate exists to prevent.
  #
  # ISSUE #335 STAGE C — the baseline is DIRECTIONAL, not immutable.
  #
  # Gate 3 used to fail on any movement, so a legitimate improvement
  # merged with this job red "by human override". That taught the next
  # reader that the freeze is negotiable, which is the failure mode plan
  # v10 named. It is now a rule with a direction, which is not a
  # loosening:
  #
  #   the baseline may move only toward FEWER divergences — never toward
  #   more, and never by a probe that agreed on `origin/main` diverging
  #   here.
  #
  # Why a decrease is safe to allow. The freeze exists to stop a POISONED
  # baseline: numbers measured after a change, so broken code agrees with
  # itself. A decrease cannot express that — it is strictly more
  # agreement with the reference, and the reference column is
  # `matrix.json`'s, which this job reads from `origin/main` and which
  # the hermetic
  # `accept_surface.rs::the_reference_column_is_frozen_against_silent_re_pinning`
  # digest independently forbids a PR to move. Only OUR side can move
  # here, and only toward the oracle. An increase stays forbidden and is
  # exactly what the freeze catches.
  #
  # The clauses are complementary, per plan v5: the per-probe clause
  # blocks the compensating swap (two probes trading places leaves every
  # total right), and the totals clause bounds what the per-probe one
  # cannot see — a probe ADDED to the baseline already diverging has no
  # prior state to move from.
  #
  # THE PROBE KEY, and why the first version of this rule was bypassable
  # (Stage C review). A probe's identity is its `query` string, and the
  # first cut both trusted that field to be stable and used list LENGTH
  # as set cardinality. That let a PR substitute probes: delete an
  # agreeing probe A, add a duplicate of a diverging probe B, then
  # improve B and regress A. Nothing "moved" — A was simply not there to
  # be looked at — and the length was unchanged, so both clauses passed
  # while the baseline quietly lost A's coverage. The key is therefore
  # treated as a SET, not a list:
  #
  #   * every key on `origin/main` must still be present at HEAD, so a
  #     rename, a replacement or a deletion is a failure, not a silence;
  #   * keys must be unique at HEAD, so a duplicate cannot pad the count
  #     back up;
  #   * both divergence totals are computed BY THE JOIN, from the probe
  #     data and the oracle, never from `length` and never from the
  #     committed constants (which are separately checked to move in the
  #     same direction);
  #   * the oracle is `origin/main`'s `matrix.json`, WITH NO FALLBACK to
  #     this branch's. A probe with no reference row on main is
  #     unscoreable and fails. The first cut fell back to HEAD's matrix
  #     for unknown keys, which let a PR add a diverging probe together
  #     with the reference row that scores it — a PR picking its own
  #     oracle, which is exactly what this rule denies. The deliberate
  #     consequence: adding a probe and moving the baseline cannot be the
  #     same PR. Land the probe with its oracle row, then move the
  #     baseline.
  #   * duplicate probe keys fail in EVERY file a join is built from —
  #     this branch's baseline, origin/main's baseline, and both
  #     matrices. `jq`'s `from_entries` keeps the LAST value for a
  #     repeated key without complaining, so a duplicate does not break
  #     the join, it silently decides it; a check that covers three of
  #     the four inputs leaves the fourth deciding.
  #
  # STATED EDGE: the totals are scored with origin/main's oracle column
  # for every key main knows. A deliberate ORACLE re-pin (the reference
  # container re-measured, `REFERENCE_DIGEST` moved) can therefore make
  # this job red even though our side did not regress. That is the
  # intended behaviour — an oracle move is exactly when a human should
  # look — and it is written down here rather than discovered.
  #
  # Gates 2 (no source alongside creation), 4 (ordering — no source
  # before the baseline exists) and the hermetic re-derivation are
  # untouched by this and still stand exactly as B0 left them.
  wire-baseline-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wire-baseline freeze gates (issue 335 B0, direction rule Stage C)
        run: |
          set -u
          BASELINE=crates/pulsus-traceql/tests/accept_surface/wire_baseline.json
          MATRIX=crates/pulsus-traceql/tests/accept_surface/matrix.json
          CHANGED=$(git diff --name-only origin/main...HEAD)
          SRC=$(printf '%s\n' "$CHANGED" \
            | grep -E '^crates/.+/src/|(^|/)build\.rs$|^Cargo\.lock$|(^|/)Cargo\.toml$|^rust-toolchain\.toml$' || true)
          if git cat-file -e origin/main:"$BASELINE" 2>/dev/null; then
            if [ -n "$(git diff --name-only origin/main...HEAD -- "$BASELINE")" ]; then
              # The baseline moved. It may only have moved toward fewer
              # divergences. Both "before" sides come from origin/main —
              # the baseline it is measured against AND the oracle column
              # it is scored with — so nothing this PR contains can
              # decide its own verdict here.
              TMP=$(mktemp -d)
              git show origin/main:"$BASELINE" > "$TMP/old_baseline.json"
              git show origin/main:"$MATRIX" > "$TMP/old_matrix.json"

              # Clause 0, the KEY SET. Everything below joins on the probe
              # query, so the join has to be total and one-to-one before
              # any verdict computed through it means anything. `jq`'s
              # from_entries silently keeps the LAST value for a repeated
              # key, so a duplicate does not error — it quietly decides
              # which row wins. Both sides of the join are checked.
              DUPLICATED=$(jq -r '
                [ .wire_baseline[].query ] | group_by(.)
                | map(select(length > 1) | .[0]) | .[]' "$BASELINE")
              if [ -n "$DUPLICATED" ]; then
                echo "::error::the wire baseline has duplicate probe keys — a probe's query IS its identity here, and a duplicate can pad the probe count back up after a deletion (issue 335 Stage C direction rule):"
                printf '%s\n' "$DUPLICATED"
                exit 1
              fi
              DUP_OLD_BASELINE=$(jq -r '
                [ .wire_baseline[].query ] | group_by(.)
                | map(select(length > 1) | .[0]) | .[]' "$TMP/old_baseline.json")
              if [ -n "$DUP_OLD_BASELINE" ]; then
                echo "::error::origin/main's wire_baseline.json has duplicate probe keys — the \$before map the MISSING and REGRESSED clauses join on would silently keep one row per key (issue 335 Stage C direction rule):"
                printf '%s\n' "$DUP_OLD_BASELINE"
                exit 1
              fi
              DUP_ORACLE=$(jq -r '
                [ .accept_surface_probes[].query ] | group_by(.)
                | map(select(length > 1) | .[0]) | .[]' "$TMP/old_matrix.json")
              if [ -n "$DUP_ORACLE" ]; then
                echo "::error::origin/main's matrix.json has duplicate probe keys — the oracle map this gate joins on would silently keep one row per key (issue 335 Stage C direction rule):"
                printf '%s\n' "$DUP_ORACLE"
                exit 1
              fi
              DUP_HEAD_ORACLE=$(jq -r '
                [ .accept_surface_probes[].query ] | group_by(.)
                | map(select(length > 1) | .[0]) | .[]' "$MATRIX")
              if [ -n "$DUP_HEAD_ORACLE" ]; then
                echo "::error::this branch's matrix.json has duplicate probe keys — the same silent last-wins join feeds the hermetic wire suite (issue 335 Stage C direction rule):"
                printf '%s\n' "$DUP_HEAD_ORACLE"
                exit 1
              fi
              # ------------------------------------------------------------
              # THE ADDITION RULE (issue 335 Stage D0, clauses A1-A5).
              #
              # Why it exists, stated rather than assumed: before it, this
              # job and the hermetic wire suite DEADLOCKED on any probe
              # addition. Adding one probe to both files fired UNJOINABLE
              # (a key main's matrix does not know); adding it to
              # matrix.json alone failed accept_surface_wire.rs's
              # positional-bijection assert. So the audit could not admit a
              # new TRUE measurement at all — a gap in the gate, not a
              # reason to refuse the improvement, which is the same
              # adjudication the Stage C direction rule got.
              #
              # This is a GENERAL rule, not a waiver for one PR. It splits
              # an ADDITION (new keys only) from a RE-PIN (an existing
              # oracle value moved), which REFERENCE_DIGEST alone cannot
              # tell apart because both move it.
              #
              # STATED EDGE, so it is not discovered later: an added
              # probe's `reference` value is supplied by the PR, so THIS
              # JOB CANNOT SCORE IT. Its protection is elsewhere and is
              # named here — accept_surface.rs::recorded_reference_verdicts_still_hold
              # re-measures EVERY probe's `reference` against the
              # digest-pinned container and runs as its own CI step
              # ("TraceQL parser accept-surface audit (oracle leg)" in
              # schema-it). That is an honest weaker statement than "this
              # gate scores it", and it is the true one.
              ADDED=$(jq -r -n --slurpfile new "$BASELINE" --slurpfile old "$TMP/old_baseline.json" '
                ([ $old[0].wire_baseline[].query ] | map({key: ., value: true}) | from_entries) as $had
                | [ $new[0].wire_baseline[].query | select(($had[.] // false) | not) ] | sort | .[]')
              ADDED_M=$(jq -r -n --slurpfile new "$MATRIX" --slurpfile old "$TMP/old_matrix.json" '
                ([ $old[0].accept_surface_probes[].query ] | map({key: ., value: true}) | from_entries) as $had
                | [ $new[0].accept_surface_probes[].query | select(($had[.] // false) | not) ] | sort | .[]')
              # A1 - an addition is an addition on BOTH sides. A baseline
              # key added without its matrix row is unscoreable; a matrix
              # row added without its baseline entry breaks the hermetic
              # positional bijection.
              if [ "$ADDED" != "$ADDED_M" ]; then
                echo "::error::the added key sets differ between the wire baseline and the probe matrix — an addition must add the SAME keys to both, or a probe scores off nothing (issue 335 Stage D0 addition rule, clause A1)."
                echo "--- added to wire_baseline.json only:"
                comm -23 <(printf '%s\n' "$ADDED") <(printf '%s\n' "$ADDED_M") || true
                echo "--- added to matrix.json only:"
                comm -13 <(printf '%s\n' "$ADDED") <(printf '%s\n' "$ADDED_M") || true
                exit 1
              fi
              # A3 - THE LOAD-BEARING CLAUSE. An existing key's oracle
              # verdict may not move alongside an addition. Without it the
              # addition rule becomes a hole through which any baseline is
              # rewritten by calling it an addition. The message names the
              # probe and BOTH values, so nobody is sent to diff two files.
              REPINNED=$(jq -r -n --slurpfile new "$MATRIX" --slurpfile old "$TMP/old_matrix.json" '
                ($new[0].accept_surface_probes | map({key: .query, value: .reference}) | from_entries) as $head
                | [ $old[0].accept_surface_probes[]
                    | select($head[.query] != null and $head[.query] != .reference)
                    | "\(.query)  origin/main=\(.reference)  HEAD=\($head[.query])" ]
                | .[]')
              if [ -n "$REPINNED" ]; then
                echo "::error::oracle re-pin — a pre-existing probe's reference verdict moved in a PR that also touches the wire baseline. An addition may only ADD keys; moving an existing oracle value is a re-pin and a human must look (issue 335 Stage D0 addition rule, clause A3):"
                printf '%s\n' "$REPINNED"
                exit 1
              fi
              ADDED_COUNT=$(printf '%s\n' "$ADDED" | grep -c . || true)
              echo "addition rule: $ADDED_COUNT added key(s), identical on both sides, no pre-existing oracle verdict moved"
              # ------------------------------------------------------------
              MISSING=$(jq -r --slurpfile new "$BASELINE" '
                ([ $new[0].wire_baseline[].query ]
                   | map({key: ., value: true}) | from_entries) as $have
                | [ .wire_baseline[].query | select(($have[.] // false) | not) ]
                | .[]' "$TMP/old_baseline.json")
              if [ -n "$MISSING" ]; then
                echo "::error::the wire baseline dropped probes present on origin/main — renaming, replacing or deleting a probe retires whatever it was showing; every origin/main key must still be present (issue 335 Stage C direction rule):"
                printf '%s\n' "$MISSING"
                exit 1
              fi
              # THE ORACLE IS origin/main's, WITH NO FALLBACK. Every probe
              # in the baseline must have a reference verdict THERE; a
              # probe whose only oracle row is on this branch is
              # unscoreable and fails. An earlier cut fell back to HEAD's
              # matrix for keys main did not know, which handed a PR the
              # ability to add a diverging probe together with the
              # reference row that scores it — the very thing the
              # "both before-sides come from origin/main" rule exists to
              # deny (Stage C review, [medium]).
              #
              # A5 (issue 335 Stage D0) narrows this by exactly one set and
              # no more: it keeps its no-fallback rule for every key in the
              # INTERSECTION, and no longer fires on a key in ADDED — which
              # A1 has already proved was added to both files and A3 has
              # already proved arrived without moving any existing oracle
              # value. Before A5 this clause made adding a probe impossible
              # in principle, which is why the issue's own follow-up
              # ("adding probes for that class is follow-up") had no
              # implementable form.
              UNJOINABLE=$(jq -r \
                --slurpfile omtx "$TMP/old_matrix.json" \
                --slurpfile old "$TMP/old_baseline.json" '
                  ($omtx[0].accept_surface_probes
                     | map({key: .query, value: .reference}) | from_entries) as $oref
                  | ($old[0].wire_baseline
                     | map({key: .query, value: true}) | from_entries) as $had
                  | [ .wire_baseline[].query
                      | select($oref[.] == null)
                      | select($had[.] // false) ]
                  | .[]' "$BASELINE")
              if [ -n "$UNJOINABLE" ]; then
                echo "::error::wire baseline probes with no reference verdict on origin/main — the oracle comes from origin/main with no fallback, so a probe added in this PR cannot be scored by a reference row this PR also supplies; land the probe first, move the baseline after (issue 335 Stage C direction rule):"
                printf '%s\n' "$UNJOINABLE"
                exit 1
              fi

              # Clause 1, per probe: nothing that AGREED on origin/main
              # may diverge here. Scored against origin/main's reference
              # column, never this PR's.
              REGRESSED=$(jq -r \
                --slurpfile old "$TMP/old_baseline.json" \
                --slurpfile mtx "$TMP/old_matrix.json" '
                  ($mtx[0].accept_surface_probes
                     | map({key: .query, value: .reference}) | from_entries) as $ref
                  | ($old[0].wire_baseline
                     | map({key: .query, value: .pulsus_wire}) | from_entries) as $before
                  | [ .wire_baseline[]
                      | select(($ref[.query] != null) and ($before[.query] != null))
                      | select($before[.query] == $ref[.query] and .pulsus_wire != $ref[.query])
                      | .query ]
                  | .[]' "$BASELINE")
              if [ -n "$REGRESSED" ]; then
                echo "::error::the wire baseline moved the WRONG WAY — these probes agreed with the reference on origin/main and diverge here; the baseline may only move toward fewer divergences (issue 335 Stage C direction rule):"
                printf '%s\n' "$REGRESSED"
                exit 1
              fi

              # Clause 2, the totals — DERIVED BY THE JOIN, from the probe
              # data and the oracle, never from `length` and never from the
              # committed constants. Bounds what clause 1 cannot see: a
              # probe added here has no prior state to move from.
              OLD_DERIVED=$(jq -r --slurpfile mtx "$TMP/old_matrix.json" '
                ($mtx[0].accept_surface_probes
                   | map({key: .query, value: .reference}) | from_entries) as $ref
                | [ .wire_baseline[]
                    | select($ref[.query] != null)
                    | select(.pulsus_wire != $ref[.query]) ] | length' "$TMP/old_baseline.json")
              # A2 (issue 335 Stage D0): NEW_DERIVED is computed over the
              # INTERSECTION only — every key origin/main knows — scored
              # with origin/main's oracle. An addition therefore cannot
              # mask a regression, and the direction rule is unchanged for
              # every key main knows. The `select($ref[.query] != null)`
              # guard is what restricts it; without it an added key scores
              # against a null reference and counts as a divergence, which
              # would make every honest addition look like decay.
              NEW_DERIVED=$(jq -r --slurpfile omtx "$TMP/old_matrix.json" '
                ($omtx[0].accept_surface_probes
                   | map({key: .query, value: .reference}) | from_entries) as $ref
                | [ .wire_baseline[]
                    | select($ref[.query] != null)
                    | select(.pulsus_wire != $ref[.query]) ]
                | length' "$BASELINE")
              if [ "$NEW_DERIVED" -gt "$OLD_DERIVED" ]; then
                echo "::error::the wire baseline's derived divergence count rose over the keys origin/main already knew ($OLD_DERIVED -> $NEW_DERIVED) — the baseline may only move toward fewer divergences (issue 335 Stage C direction rule, clause A2)"
                exit 1
              fi
              # A4 (issue 335 Stage D0): the ADDED keys' divergences,
              # computed with HEAD's oracle — necessarily, because main has
              # none — and PRINTED, so a fourfold rise arrives with its
              # arithmetic beside it instead of looking like decay. The
              # committed constant is then DERIVED BY THE JOIN and asserted
              # equal, never merely bounded: this identity replaces the old
              # `NEW_DIVERGE <= OLD_DIVERGE` bound and is strictly stronger,
              # because a bound cannot see a constant that is wrong in the
              # allowed direction.
              ADDED_DERIVED=$(jq -r --slurpfile omtx "$TMP/old_matrix.json" --slurpfile nmtx "$MATRIX" '
                ($omtx[0].accept_surface_probes
                   | map({key: .query, value: .reference}) | from_entries) as $oref
                | ($nmtx[0].accept_surface_probes
                   | map({key: .query, value: .reference}) | from_entries) as $href
                | [ .wire_baseline[]
                    | select($oref[.query] == null)
                    | select(.pulsus_wire != $href[.query]) ]
                | length' "$BASELINE")
              OLD_DIVERGE=$(jq -r '.WIRE_DIVERGE_BASELINE' "$TMP/old_baseline.json")
              NEW_DIVERGE=$(jq -r '.WIRE_DIVERGE_BASELINE' "$BASELINE")
              WANT_DIVERGE=$(( NEW_DERIVED + ADDED_DERIVED ))
              if [ "$NEW_DIVERGE" -ne "$WANT_DIVERGE" ]; then
                echo "::error::the committed WIRE_DIVERGE_BASELINE ($NEW_DIVERGE) is not the count the join derives ($NEW_DERIVED over the keys origin/main knows + $ADDED_DERIVED over the $ADDED_COUNT added key(s) = $WANT_DIVERGE) — the constant must be derived, never asserted (issue 335 Stage D0 addition rule, clause A4)"
                exit 1
              fi
              KEYS=$(jq -r '[ .wire_baseline[].query ] | unique | length' "$BASELINE")
              echo "wire baseline: derived diverge over origin/main's keys $OLD_DERIVED -> $NEW_DERIVED, plus $ADDED_DERIVED over $ADDED_COUNT added key(s); committed $OLD_DIVERGE -> $NEW_DIVERGE = $NEW_DERIVED + $ADDED_DERIVED, over $KEYS unique probe keys, every origin/main key still present, none regressed"
            fi
          else
            if printf '%s\n' "$CHANGED" | grep -qx "$BASELINE"; then
              if [ -n "$SRC" ]; then
                echo "::error::the wire baseline may only be created by a PR with no source, build-script, manifest or toolchain change (crates/**/src/** at any depth, any build.rs, Cargo.lock, any Cargo.toml, rust-toolchain.toml) — issue 335 B0 no-source gate"
                exit 1
              fi
            fi
            if [ -n "$SRC" ]; then
              echo "::error::source change before the wire baseline exists on origin/main — Stage B work may not merge before B0 (issue 335 ordering gate)"
              exit 1
            fi
          fi

  conformance-evidence-debt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conformance evidence debt may only shrink (issue 335 Stage D0)
        run: |
          set -u
          set -o pipefail
          DISP=crates/pulsus-traceql/tests/conformance/dispositions.json
          FILTER=ci/jq/conformance-evidence-debt.jq
          TMP=$(mktemp -d)
          if ! git cat-file -e origin/main:"$DISP" 2>/dev/null; then
            echo "origin/main has no $DISP yet; nothing to compare against"
            exit 0
          fi
          git show origin/main:"$DISP" > "$TMP/old_dispositions.json"
          # FAIL OPEN, LOUDLY. The first cut of this gate interpolated the
          # filter through a shell variable; jq errored on the subset step,
          # printed to stderr, and the shell read an empty result — so the
          # gate PASSED on every case including both attacks. It failed
          # open and looked green. Hence: the filter lives in a file, jq
          # runs with -e so an error is distinguishable from an empty
          # result, and a non-0/1 exit is reported as GATE ERROR rather
          # than swallowed.
          set +e
          GROWN=$(jq -r -e --slurpfile old "$TMP/old_dispositions.json" -f "$FILTER" "$DISP")
          RC=$?
          set -e
          if [ "$RC" -gt 1 ]; then
            echo "::error::GATE ERROR — jq exited $RC evaluating $FILTER against $DISP. This gate did not run; it is NOT a pass."
            exit 2
          fi
          if [ -n "$GROWN" ]; then
            echo "::error::the conformance evidence debt GREW — a 'supported' disposition with no evidence is a claim with no witness, and the set may only SHRINK (issue 335 Stage D0). New debt on this branch:"
            printf '%s\n' "$GROWN"
            exit 1
          fi
          echo "conformance evidence debt did not grow"

  schema-it:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Issue #87: pinned nextest (same pin as the `ci` job) for the
      # API-suite steps' structured output below.
      - name: Install cargo-nextest (pinned)
        run: curl -LsSf https://get.nexte.st/0.9.140/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Start ClickHouse 26.3
        run: |
          docker run -d --name pulsus-ch-schema-it -p 19123:8123 -p 19000:9000 \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/users.d/network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro \
            clickhouse/clickhouse-server:26.3
          for _ in $(seq 1 30); do
            curl -sf http://localhost:19123/ping && break
            sleep 1
          done

      - name: Live schema tests (single-node, migrations + MVs + crash/retry)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-schema --test live_schema

      # Issue #113 (M7-A2): native-histogram storage schema — migrations 23–26
      # apply + idempotent (no MigrationDrift), metric_hist_samples +
      # metric_series.value_type exist, an EXPLAIN indexes=1 metric_name-led PK
      # prune on metric_hist_samples matching the metric_samples gate, and a
      # native-histogram row round-trips losslessly for both an exponential and
      # an NHCB sample. Reuses this job's 26.3 container.
      - name: Live native-histogram schema tests (migrations + EXPLAIN + round-trip)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-schema --test live_hist_schema

      # Issue #53: traces-family tables + tag-catalog MV, retention-change
      # propagation, and the two docs/schemas.md §4.2 EXPLAIN gates on a
      # seeded ≥100k-row corpus (EXPLAIN indexes=1 + query_log.projections —
      # `EXPLAIN projections=1` is 25.x-only). Reuses this job's 26.3
      # container.
      - name: Live traces schema tests (tables + MV + EXPLAIN gates)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-schema --test live_traces

      # Issue #11: docs/schemas.md §9's "EXPLAIN indexes = 1 output for the
      # canonical queries is snapshot-tested" gate for the LogQL read path —
      # reuses this job's ClickHouse 26.3 container verbatim.
      - name: LogQL EXPLAIN indexes gate
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test explain_indexes

      # Issue #171 (M7-C3): the `/api/logs/v1/patterns` Tier-1 gate — the
      # `(fingerprint, bucket_ns, pattern)` PK prefix time-key pruning (narrow
      # window selects fewer granules than the fingerprint's total) and daily
      # partition pruning, plus the end-to-end `PatternSeries` assembly.
      - name: Log patterns EXPLAIN + engine gate
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test patterns_explain

      # Issue #55: the trace-by-ID point read's EXPLAIN primary-key gate
      # (PrimaryKey block keyed on trace_id, granules pruned) on a seeded
      # 100k-trace corpus, plus the TraceEngine fetch round-trip. Reuses
      # this job's ClickHouse 26.3 container.
      - name: Trace point-read EXPLAIN gate
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test traces_point_read

      # Issue #180/#185 (M7-TQ1/TQ6): the black-box TraceQL differential
      # oracle. ONE UNMODIFIED, digest-pinned grafana/tempo v3.0.2 serves
      # BOTH the syntax leg (observes only HTTP status) and the compare()
      # VALUE leg (issue #185/#189). The augmented `tempo-compare.yaml`
      # config adds the OTLP HTTP receiver (:4318) + the local-blocks
      # metrics processor with aggressive ingest flush so freshly-pushed
      # spans become compare()-queryable within the test's bounded poll —
      # without affecting the syntax leg. No Tempo source is copied. The
      # hermetic `ci` job runs both tests with their gates off, skipping.
      - name: Start Tempo v3.0.2 (differential oracle)
        run: |
          docker run -d --name pulsus-tempo-diff -p 13200:3200 -p 4318:4318 \
            -v "$GITHUB_WORKSPACE"/ci/tempo/tempo-compare.yaml:/etc/tempo/tempo.yaml:ro \
            grafana/tempo@sha256:aa8df8d069f77b82e978464daf55169bb8d135852ad58700aa96880653c3d8f7 \
            -config.file=/etc/tempo/tempo.yaml
          for _ in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:13200/ready)" = "200" ] && break
            sleep 1
          done
          curl -sf http://localhost:13200/ready

      - name: TraceQL Tempo differential leg (syntax)
        env:
          PULSUSDB_TEMPO_DIFF_URL: "http://localhost:13200"
          # Issue #328: the semantic validator's container capture,
          # re-verified live against the same pinned oracle. FAIL-CLOSED:
          # `require_live_gate` panics if this env block is dropped in
          # this job (the #320 class), so an absent capture cannot
          # report green.
          PULSUSDB_TEMPO_VECTORS: "1"
        run: cargo test -p pulsus-traceql --test tempo_differential

      # Issue #335: the parser accept-surface audit. Replays the whole
      # precedence / operand-position probe matrix against the SAME
      # digest-pinned oracle and asserts every recorded reference verdict
      # still holds, so a divergence can only be added or closed
      # deliberately. Runs before the legs that push spans into the
      # container: the recorded verdicts were captured against both an
      # empty and a populated store and are stable either way, but keeping
      # the syntax legs first keeps that independence obvious.
      - name: TraceQL parser accept-surface audit (oracle leg)
        env:
          PULSUSDB_TEMPO_DIFF_URL: "http://localhost:13200"
        run: cargo test -p pulsus-traceql --test accept_surface

      # Issue #185/#189 (M7-TQ6): the compare() VALUE differential, ENFORCED
      # (non-skipped). Pushes fixture OTLP spans to the reference's :4318
      # receiver, waits for them to become metrics-queryable, then asserts
      # byte-parity of compare()'s statusMessage / rootName / rootServiceName
      # values against PulsusDB (over this job's ClickHouse 26.3 on 19123).
      - name: TraceQL Tempo differential leg (compare values)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
          PULSUSDB_COMPARE_DIFF_URL: "http://localhost:13200"
          PULSUSDB_COMPARE_OTLP_URL: "http://localhost:4318"
        run: cargo test -p pulsus-read --test compare_value_differential

      # Issue #460: the compare() ARITY value differential, ENFORCED
      # (non-skipped). Same digest-pinned oracle and same ClickHouse. Gates
      # what the ARGUMENTS do rather than which values a fixed query emits:
      # that `topN` (reference default 10, so it bites on the one-argument
      # form too) trims each attribute per side, that trimmed values are
      # dropped rather than folded into the `key=nil` complement or the
      # `*_total` denominators, and that the `(start, end]` selection
      # window REPARTITIONS the population into baseline/selection instead
      # of filtering it (both totals still sum to the whole corpus).
      - name: TraceQL Tempo differential leg (compare arities)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
          PULSUSDB_COMPARE_DIFF_URL: "http://localhost:13200"
          PULSUSDB_COMPARE_OTLP_URL: "http://localhost:4318"
        run: cargo test -p pulsus-read --test compare_arity_differential

      # Issue #193: the by()/coalesce() grouped-response VALUE differential,
      # ENFORCED (non-skipped). Reuses the SAME digest-pinned tempo v3.0.2
      # oracle: pushes fixture spans to :4318, then asserts grouped /
      # coalesced spanSet-array parity (per-trace group-tuple set + per-group
      # span-id membership + attributes typing) against PulsusDB's real
      # search executor over this job's ClickHouse 26.3 on 19123.
      - name: TraceQL Tempo differential leg (by()/coalesce grouping)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
          PULSUSDB_GROUPING_DIFF_URL: "http://localhost:13200"
          PULSUSDB_GROUPING_OTLP_URL: "http://localhost:4318"
        run: cargo test -p pulsus-read --test traces_search_grouping_differential

      # Issue #479: the matched-span PROJECTION differential, ENFORCED
      # (non-skipped). Reuses the SAME digest-pinned oracle: pushes ONE
      # OTLP/JSON body to :4318 and decodes those same bytes through our
      # own ingest parser, then compares, per matched span, the multiset of
      # projected attribute keys and the `name`-present flag over a
      # 30-case registry. FAIL-CLOSED: all three gates go through
      # pulsus_testkit's require_* guards, so dropping this env block
      # panics rather than reporting green.
      - name: TraceQL Tempo differential leg (matched-span projection)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
          PULSUSDB_PROJECTION_DIFF_URL: "http://localhost:13200"
          PULSUSDB_PROJECTION_OTLP_URL: "http://localhost:4318"
        run: cargo test -p pulsus-read --test traces_search_projection_differential

      # Issue #458: the metrics-FILTER accept surface, oracle half. Replays
      # every probe in crates/pulsus-read/tests/fixtures/metrics_filter_accept.json
      # against the SAME digest-pinned oracle and asserts every committed
      # reference verdict (and every rejecting body) still holds. FAIL-CLOSED:
      # `require_live_gate` panics if this env block is dropped in this job,
      # so a missing capture cannot report green (the #320 class). The
      # hermetic half runs in the `ci` job at no container cost.
      - name: TraceQL metrics-filter accept surface (oracle leg)
        env:
          PULSUSDB_TEMPO_DIFF_URL: "http://localhost:13200"
        run: cargo test -p pulsus-read --test traces_metrics_filter_accept

      # Issue #458: the metrics-filter VALUE differential, ENFORCED. Pushes
      # one shared corpus (6 traces x 3 spans, exactly one parentless span
      # per trace) into both systems and asserts that
      # `{ nestedSetParent < 0 } | count_over_time()` totals 6 and
      # `{} | count_over_time()` totals 18 on BOTH sides. This is the only
      # leg that catches an accept-preserving answer corruption of the root
      # lowering against the reference itself.
      - name: TraceQL Tempo differential leg (metrics filter values)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
          PULSUSDB_METRICS_FILTER_DIFF_URL: "http://localhost:13200"
          PULSUSDB_METRICS_FILTER_OTLP_URL: "http://localhost:4318"
        run: cargo test -p pulsus-read --test traces_metrics_filter_differential

      # Issue #474: the byte-frozen capture of what the reference answers
      # for a trace whose sender omitted `resource`, `scope` or `status`,
      # and for the v2 fetch envelope. Replays the committed artifact
      # against the SAME digest-pinned oracle, so the capture cannot go
      # stale unnoticed. Pushes its own four-span fixture through the
      # container's OTLP receiver; needs no ClickHouse. FAIL-CLOSED: both
      # endpoint gates panic if this env block is dropped (the #320 class).
      - name: Nullable-submessage wire capture (oracle leg)
        env:
          PULSUSDB_NULLABLE_WIRE_DIFF_URL: "http://localhost:13200"
          PULSUSDB_NULLABLE_WIRE_OTLP_URL: "http://localhost:4318"
        run: cargo test -p pulsus-server --test trace_nullable_wire_differential

      # Issue #478: the tag-values oracle leg. TWO fresh reference
      # containers, and the reason is measured rather than a preference:
      # on this pinned build the tag-value time filtering is
      # BLOCK-granular, not span-granular — two corpora pushed 120 s apart
      # were both returned by a window covering only the later one — so a
      # window cannot separate two corpora inside one instance. The
      # #476 sections therefore replay against their own container, with
      # their own corpus, exactly as they were captured; this plan's
      # sections replay against the other in the order they were captured.
      # Neither may be the shared `pulsus-tempo-diff` above, which by this
      # point in the job holds several other suites' spans. Needs no
      # ClickHouse. FAIL-CLOSED: all four endpoint gates panic if this env
      # block is dropped (the #320 class).
      - name: Start Tempo v3.0.2 (tag-values oracle, two instances)
        run: |
          start_one() {
            docker run -d --name "$1" -p "$2":3200 -p "$3":4318 \
              -v "$GITHUB_WORKSPACE"/ci/tempo/tempo-compare.yaml:/etc/tempo/tempo.yaml:ro \
              grafana/tempo@sha256:aa8df8d069f77b82e978464daf55169bb8d135852ad58700aa96880653c3d8f7 \
              -config.file=/etc/tempo/tempo.yaml
          }
          start_one pulsus-tempo-478a 13478 14478
          start_one pulsus-tempo-478b 13479 14479
          for port in 13478 13479; do
            for _ in $(seq 1 40); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$port/ready)" = "200" ] && break
              sleep 1
            done
            curl -sf "http://localhost:$port/ready"
          done

      - name: Tag-values reference capture (oracle leg)
        env:
          PULSUSDB_TAG_VALUES_DIFF_URL: "http://localhost:13478"
          PULSUSDB_TAG_VALUES_OTLP_URL: "http://localhost:14478"
          PULSUSDB_TAG_VALUES_476_DIFF_URL: "http://localhost:13479"
          PULSUSDB_TAG_VALUES_476_OTLP_URL: "http://localhost:14479"
        run: cargo test -p pulsus-server --test trace_tag_values_differential

      - name: Stop Tempo tag-values oracles
        if: always()
        run: docker rm -f pulsus-tempo-478a pulsus-tempo-478b || true

      - name: Stop Tempo differential oracle
        if: always()
        run: docker rm -f pulsus-tempo-diff || true

      # Issue #191 (M8-LQ0): the black-box LogQL differential oracle. ONE
      # UNMODIFIED, digest-pinned v3.7.4 reference container serves the syntax
      # leg (observes only HTTP status at /loki/api/v1/query_range — or
      # /loki/api/v1/query for the registry's instant-only constructs, issue
      # #221; the mounted config enables approx_topk so its probe is
      # conclusive). Every registry probe's live accept/reject verdict is
      # pinned against the recorded `oracle` disposition; a supported∧reject
      # is RED. No upstream source is copied. The hermetic `ci` job runs the
      # same test with its gate off, skipping.
      - name: Start LogQL v3.7.4 reference (differential oracle)
        run: |
          docker run -d --name pulsus-logql-diff -p 13100:3100 \
            -v "$GITHUB_WORKSPACE"/ci/logql/config.yaml:/etc/loki/local-config.yaml:ro \
            grafana/loki@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc \
            -config.file=/etc/loki/local-config.yaml
          # Issue #291. This wait is NOT the readiness authority and must
          # not be treated as one: `logql_regex_accept_matrix.rs`'s
          # `wait_for_reference` is, and it gates its own leg regardless
          # of what happens here.
          #
          # It used to poll `/ready` ALONE, which is not sufficient —
          # review measured a query failing with `empty ring` after
          # `/ready` was already 200, while on other hardware a trivial
          # query succeeds ~13 s BEFORE `/ready` does. Which signal
          # settles last is environment-dependent, so this now waits on
          # the same CONJUNCTION the suite's gate uses rather than a
          # weaker half of it.
          #
          # It exists only because the OTHER reference-facing legs below
          # (`logql_differential`, the nested-ip and logfmt matrices) have
          # no gate of their own and would otherwise probe a container
          # that is still refusing connections. Hoisting
          # `wait_for_reference` into a shared helper so they gate
          # themselves is the real fix and spans seven suites; it is not
          # #291's to make.
          # A WALL-CLOCK deadline, not an attempt count. This was
          # `seq 1 180` with a message saying "within 180s", and those are
          # not the same bound: an attempt costs up to 5 s + 15 s of probe
          # timeout plus the sleep, so 180 attempts can run for about an
          # hour while claiming three minutes. Counting time means the
          # printed bound is the bound enforced and the two cannot drift
          # apart again.
          #
          # 180 s deliberately, for two reasons rather than inheritance:
          # it is the same bound `wait_for_reference` uses in
          # `logql_regex_accept_matrix.rs`, so the container has ONE
          # readiness budget rather than two that can disagree; and the
          # cold-start settle measured on constrained containers is
          # ~23-27 s (`/ready` 503 until ~23 s at 2 CPU / 4 GB), so it is
          # roughly seven times the observed worst. The per-probe
          # timeouts below are unchanged — they are what makes a single
          # attempt bounded; this bounds the sequence of them.
          ready=''
          probe=''
          started=$(date +%s)
          deadline=$(( started + 180 ))
          # A FAILING PROBE IS DATA, NOT AN ABORT. GitHub runs `run:` under
          # `bash -e {0}`, and an unguarded `var=$(curl …)` takes curl's
          # exit status as the assignment's — so the first probe that
          # fails kills the step before the loop can retry and before the
          # reporting below can run. That is exactly what happened on
          # #418: the step died with `Process completed with exit code 56`
          # and printed none of the diagnosis, because a cold Loki
          # accepted the connection and reset it. A probe failing during
          # startup is the EXPECTED case — it is why this loop exists —
          # so each probe is explicitly made non-fatal and its cause is
          # read out of `%{exitcode}`/`%{errormsg}` instead of the shell's
          # `$?`. Must tolerate 7 (connect), 28 (timeout), 52 (empty
          # reply) and 56 (reset by peer) and keep waiting.
          probe_url() {
            curl -s -o /dev/null -w '%{http_code}|%{exitcode}|%{errormsg}' "$@" || true
          }
          while [ "$(date +%s)" -lt "$deadline" ]; do
            ready=$(probe_url --max-time 5 http://localhost:13100/ready)
            now=$(date +%s)
            probe=$(probe_url --max-time 15 -G \
              http://localhost:13100/loki/api/v1/query_range \
              --data-urlencode 'query={app="pulsus_readiness_probe"}' \
              --data-urlencode "start=$(( (now - 300) ))000000000" \
              --data-urlencode "end=${now}000000000" \
              --data-urlencode 'step=60s')
            [ "${ready%%|*}" = '200' ] && [ "${probe%%|*}" = '200' ] && break
            sleep 1
          done
          # The step's exit condition must be the SAME predicate as the
          # loop's. It was not: the loop broke on the conjunction while
          # the check after it was `curl -sf /ready` alone, so a loop that
          # exhausted with `/ready` 200 and the query non-200 PASSED the
          # step and handed the ungated legs below the exact state the
          # loop had just proved insufficient. Both results are kept and
          # both are asserted, and the message prints both so a future
          # failure says WHICH half was missing rather than just that the
          # wait ended.
          if [ "${ready%%|*}" != '200' ] || [ "${probe%%|*}" != '200' ]; then
            # The elapsed time is MEASURED and printed, not asserted from
            # the deadline: the loop stops STARTING attempts at 180 s, so
            # a final attempt already in flight can carry it ~20 s past
            # (measured: 189 s against a blackhole where every probe times
            # out). Printing the real number is what stops this message
            # from drifting away from the mechanism a third time.
            elapsed=$(( $(date +%s) - started ))
            echo "the reference never became serviceable — gave up after ${elapsed}s (deadline 180s, plus the attempt already in flight)" >&2
            echo "  /ready      http|exit|err = ${ready}" >&2
            echo "  query_range http|exit|err = ${probe}" >&2
            docker logs --tail 50 pulsus-logql-diff >&2 || true
            exit 1
          fi

      - name: LogQL differential leg (syntax)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-logql --test logql_differential

      # Issue #277: the `variants(...)` skip-and-warn leg. Spawns the real
      # `pulsusdb` binary against this job's ClickHouse 26.3 on 19123,
      # seeds a 501-group dataset into BOTH stores, and asserts at the
      # HTTP surface that a breaching variant is skipped with a 200 and a
      # `warnings` array rather than failing the query — plus that the
      # top-level key sequence, the warnings array and the surviving
      # `__variant__` set agree with the reference.
      #
      # It also pins the ONE place they disagree: a RANGE variant of
      # exactly 500 series, which the reference drops (its
      # `multiVariantVectorsToSeries` tests the length before the
      # series-existence lookup its sibling guards with `!ok`) and
      # PulsusDB serves. Both halves are asserted, so ledger entry (d)'s
      # over-acceptance is measured on both sides rather than assumed.
      #
      # MUST STAY ABOVE "Stop LogQL differential oracle" — it needs the
      # container that step removes. The suite's PulsusDB half is gated on
      # PULSUS_TEST_CLICKHOUSE and its differential half additionally on
      # PULSUSDB_LOGQL_DIFF_URL, so the hermetic `ci` job runs the same
      # binary with both off and skips.
      - name: LogQL differential leg (variants skip-and-warn, issue #277)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: ci/test-summary.sh run logs_variants_warnings_live -p pulsus-server --test logs_variants_warnings_live

      # Issue #455: the invalid-UTF-8 substitution differential. Spawns
      # the real `pulsusdb` binary against this job's ClickHouse 26.3 on
      # 19123 with PULSUS_COMPAT_ENDPOINTS on, pushes the SAME seed to
      # both stores over /loki/api/v1/push, then compares the
      # `__error_details__` label and the log line at
      # /loki/api/v1/query_range against this container — VALUES, not
      # just HTTP status.
      #
      # It asserts both the parity rows (the `bytes` family, where the
      # reference's own slot already held U+FFFD, is now byte-identical on
      # the label AND the entry) and the one that stays divergent (the
      # `%v` family, where the reference serves raw invalid bytes a
      # `Cow<'a, str>` cannot hold). Its second leg covers the streams
      # collision: two label sets that become identical after the
      # substitution, at a window the reference does not split and one it
      # does, plus a second ordering fixture and a parse rejection.
      #
      # MUST STAY ABOVE "Stop LogQL differential oracle" — it needs the
      # container that step removes. It pushes, so it runs after the
      # status-only legs above. Both halves are gated: the PulsusDB half
      # on PULSUS_TEST_CLICKHOUSE, the differential half additionally on
      # PULSUSDB_LOGQL_DIFF_URL, so the hermetic `ci` job runs the same
      # binary with both off and skips — while its ledger-shape test calls
      # the live gate directly, so a lost `env:` block here fails loudly
      # instead of reporting green (issue #320).
      - name: LogQL differential leg (invalid-UTF-8 substitution, issue #455)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: ci/test-summary.sh run logs_utf8_substitution_live -p pulsus-server --test logs_utf8_substitution_live

      # Issue #392: the identifier rune set — general category `L`, plus
      # `Nd` in non-leading position, which is Go `text/scanner`'s default
      # `isIdentRune` and therefore the reference's rule
      # (`pkg/logql/syntax/query_scanner.go:338-343 @ v3.7.4`, never
      # overridden). Replays the 29-row rune boundary and the 18 grammar
      # positions against this container and compares them with the
      # verdicts committed in the test. Status only, no pushes.
      #
      # IT MUST RUN BEFORE THE LEGS THAT PUSH. The container is shared,
      # and `logql_regex_accept_matrix.rs` pushes `{"app":"x",…}` into it;
      # any leg probing `{app=…} | logfmt <non-ascii>="…"` over a MATCHING
      # stream gets a 500 (the reference cannot render a non-ASCII label
      # name), which reads as a finding but is only step order. The test
      # defends itself with its own selector plus an up-front assertion
      # that the selector matches nothing, so a future push to it fails
      # loudly rather than silently. The hermetic half (the parser's own
      # verdict over the same tables, the committed Unicode tables, and
      # the Unicode 16.0-vs-15.0 skew tripwire) runs in the `ci` job with
      # the gate off.
      - name: LogQL differential leg (identifier charset, issue #392)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-logql --test identifier_charset

      # Issue #248: the nested-`ip()` accept/reject matrix — every
      # position an `ip()` label filter can occupy x both operators x
      # well-formed and malformed patterns, put to this container and
      # compared against the verdicts committed in the test. Status only,
      # no pushes: the disposition is decided before a line is read. The
      # hermetic half (PulsusDB's own verdict at parse -> plan -> compile,
      # and the pre-#248 rule replayed over the same matrix) runs in the
      # `ci` job with the gate off.
      - name: LogQL differential leg (nested ip() matrix, issue #248)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logql_nested_ip_matrix

      # Issue #247: the `| logfmt <id>="<expr>"` extraction-expression
      # accept/reject matrix — every position the extraction can occupy x
      # the expression shapes that discriminate the reference's own
      # sub-grammar (pkg/logql/log/logfmt/ @ v3.7.4), plus the extraction
      # -list shapes, plus a per-route surface axis. Put to this same
      # container and compared against the verdicts committed in the
      # test. The window ends at `now`, which is load-bearing: a
      # sub-grammar rejection is a 200 there once the window's end is
      # older than query_ingesters_within, so a stale window would score
      # the reference as accepting all of it. Status only, no pushes. The
      # hermetic half (PulsusDB's own verdict at parse -> plan -> compile,
      # and the pre-#247 rule replayed over the same matrix) runs in the
      # `ci` job with the gate off.
      - name: LogQL differential leg (logfmt expression matrix, issue #247)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logql_logfmt_expr_matrix

      # Issue #388: the `| pattern "…"` argument sub-grammar
      # (pkg/logql/log/pattern/ @ v3.7.4) x every position the stage can
      # occupy. Put to this same container and compared against the
      # verdicts AND the reference's own inner error text committed in
      # the test.
      #
      # The window ends at `now` here too, but for this leg that is NOT
      # load-bearing and the test says so by asserting the opposite
      # property: a pattern rejection is raised inside ParseExpr
      # (syntax/ast.go:730-741), so it is 400 in EVERY window, and
      # `live_the_pattern_rule_is_window_independent` re-measures every
      # point over a 24 h-stale window with the json and logfmt rules
      # beside it as controls. Status only, no pushes. The hermetic half
      # (PulsusDB's own verdict at parse -> plan -> compile, the
      # `5d91ef1` rule replayed over the same matrix, the rule-table and
      # tree-sweep checks) runs in the `ci` job with the gate off.
      - name: LogQL differential leg (pattern sub-grammar matrix, issue #388)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logql_pattern_expr_matrix

      # Issue #394, folded into #388: the `| json <id>="<expr>"`
      # extraction-expression sub-grammar (pkg/logql/log/jsonexpr/ @
      # v3.7.4 — a DIFFERENT grammar from logfmt's, so no harness is
      # shared) x every position. Compared against the committed verdicts
      # and the reference's inner error text.
      #
      # The window ends at `now` and here it IS load-bearing, exactly as
      # in the logfmt leg: this rejection is a Stage() error and the
      # reference answers 200 for it once the window's end is older than
      # query_ingesters_within, so a stale window would score the whole
      # sub-grammar as accepted. `live_the_json_rule_is_window_dependent`
      # measures that, with the pattern rule beside it as the control.
      # Status only, no pushes.
      - name: LogQL differential leg (json expression matrix, issue #388)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logql_json_expr_matrix

      # Issue #246: the regex accept/reject surface — every LogQL
      # construct that carries a user regex x the pattern classes where
      # Go's regexp and the Rust regex crate disagree, plus the two
      # positions that MASK the whole set (a `| regexp` without a named
      # capture, and a selector with no positive matcher: both sides
      # refuse those for reasons that have nothing to do with the regex),
      # plus the template-function axis, whose reference half needs one
      # pushed line. Put to this same container and compared against the
      # verdicts committed in the test. The window ends at `now`, and here
      # that is load-bearing for one more reason than the logfmt leg's:
      # the reference raises a LINE FILTER's regex error at pipeline
      # BUILD, so over a stale window it answers 200 and this leg would
      # score it as accepting every malformed pattern. The hermetic half
      # (PulsusDB's own verdict at parse -> plan -> compile, the
      # divergence enumeration, the Go error-code census, the compile-site
      # enumeration and the template axis) runs in the `ci` job with the
      # gate off.
      - name: LogQL differential leg (regex accept matrix, issue #246)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logql_regex_accept_matrix

      # Issue #339: the keyword case-folding table. Its verdicts were
      # CAPTURED from this same container (which keywords fold, which
      # token classes are case-sensitive); this leg replays them so the
      # capture cannot silently rot. The hermetic half of the file runs
      # in the `ci` job with the gate off.
      - name: LogQL differential leg (keyword case folding)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-logql --test case_folding

      # Issue #287 (fix round 3): the `| json` key-name capture drift leg.
      # Re-pushes every probe of tests/fixtures/json_key_sanitization/
      # capture.json to this job's reference container and asserts the
      # fresh responses derive the same labels as the committed artifact,
      # so the artifact provably stays a capture, not a hand-written
      # expectation (regenerating it is separately gated on a container
      # reporting exactly the pinned v3.7.4; since the oracle bump this
      # leg runs against that same v3.7.4 image). **This is the only leg
      # that compares VALUES against the container — every other leg on
      # this container compares HTTP status alone.**  Runs after the
      # syntax leg so the pushed streams cannot precede it.
      - name: LogQL json key capture drift leg (issue #287)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logql_json_key_sanitization

      # Issue #381: the structured-metadata collision capture drift leg.
      # Re-pushes every probe of pulsus-write/tests/fixtures/
      # structured_metadata_collisions/capture.json to this job's reference
      # container and asserts the fresh answers match the committed capture,
      # so the artifact the parity assertions DERIVE their expectations from
      # provably stays a capture. Like the #287 leg above it compares VALUES,
      # not just HTTP status; the hermetic legs of the same file run in the
      # `ci` job with the gate off. One push of 18 one-entry streams and one
      # query_range each.
      - name: Structured-metadata collision capture drift leg (issue #381)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-write --test structured_metadata_collisions

      # Issue #483: the ingest-time `detected_level` capture drift leg.
      # Re-pushes every row of pulsus-write/tests/fixtures/detected_level/
      # reference_cases.json to this job's reference container — 56 push
      # rows, 24 OTLP rows and 10 cap rows, one one-entry stream each — and
      # asserts the fresh answers match the committed capture, so the table
      # the rule's expectations are READ from provably stays a capture
      # rather than a transcription of our own output. Like the #287 and
      # #381 legs above it compares VALUES, not just HTTP status; the
      # hermetic legs of the same file run in the `ci` job with the gate
      # off.
      - name: detected_level capture drift leg (issue #483)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-write --test detected_level_reference_cases

      # corpus-counts: none (ci-replay-leg)
      # Issue #352 step 3: the LogQL corpus replay. Takes each reachable
      # corpus case's `load` to this same reference and compares its
      # answer against the committed expectation, so a capture that goes
      # STALE is caught rather than trusted forever. NIGHTLY/dispatch
      # only: drift is a property of time passing, not of the commit
      # under test, and the leg makes a sequential push per reachable
      # row.
      #
      # It verifies VALUES; it does not verify provenance markers — it
      # reads them to decide which rows it may compare. Only some of the
      # rows the markers permit are physically reachable; the gap is
      # enumerated by reason in the test, dominated by the template rows
      # pinned to an absolute date the reference will not serve. The
      # figures live on REACHABLE / PROVENANCE_PERMITS in
      # logqltest_replay.rs, which assert them against the corpus, and
      # are deliberately not restated here: a hand-copied count beside a
      # machine-checked figure drifts (issue #248 found a stale copy in
      # round after round — this comment, the test's own module doc, and
      # PROVENANCE.md). The `corpus-counts: none` marker above makes that
      # rule enforceable rather than advisory; see
      # `check_f_marked_regions_state_no_corpus_count`.
      # corpus-counts: end (ci-replay-leg)
      # Issue #463: the `categorize-labels` capture drift leg. Re-pushes
      # every probe of pulsus-server/tests/fixtures/categorize_labels/
      # capture.json to this job's reference container, TWICE at least two
      # seconds apart, and asserts (a) the two runs project identically —
      # which catches a wall-clock dependence whatever produced it, with
      # no list of time functions to keep current — and (b) the fresh
      # answers match the committed capture. Like the #287 and #381 legs
      # above it compares VALUES, not just HTTP status; the hermetic legs
      # of the same file run in the plain `ci` job.
      #
      # It is the only leg on this container that opens a WEBSOCKET: the
      # tail probes carry a request header, which is exactly what a
      # browser cannot do, so this surface has no client and is covered
      # here or nowhere. Eighteen tail probes with a six-second
      # post-connect drain each dominate the runtime (~6 min per pass,
      # ~12 min for the double run); it runs last on this container for
      # that reason.
      #
      # It runs against its OWN container. `ci/logql/config-463.yaml` is
      # the shared config plus `discover_log_levels: false`, and the
      # difference is load-bearing rather than tidy: with discovery on
      # the reference appends a level pair to every entry, and on the
      # UNFLAGGED read path structured metadata merges into the stream
      # label set — so that pair takes part in the grouping and two
      # entries differing only in discovered level come back as two
      # stream objects. Eliding the NAME from both sides afterwards
      # leaves that split behind and manufactures a difference the
      # elision itself created (measured: probe `A` returned seven stream
      # objects there against PulsusDB's six). The shared container keeps
      # its config, because two other committed captures assert the level
      # pair is PRESENT in every entry they hold.
      - name: Start LogQL v3.7.4 reference with level discovery off (issue #463)
        run: |
          docker run -d --name pulsus-logql-diff-463 -p 13101:3100 \
            -v "$GITHUB_WORKSPACE"/ci/logql/config-463.yaml:/etc/loki/local-config.yaml:ro \
            grafana/loki@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc \
            -config.file=/etc/loki/local-config.yaml
          deadline=$(( $(date +%s) + 180 ))
          until [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:13101/ready)" = "200" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "the #463 reference never became ready" >&2
              docker logs --tail 50 pulsus-logql-diff-463 >&2 || true
              exit 1
            fi
            sleep 2
          done

      # SCOPED to the one test that talks to the reference. The suite's
      # binary also holds four live-DATABASE tests, and running the whole
      # binary here executed them in a job whose live-database gate this
      # step does not set — the workspace's fail-closed gate caught it and
      # reddened four tests rather than letting them skip and report
      # green. Each step now runs exactly its own leg, and the two gates
      # are complementary: this one supplies the endpoint and selects the
      # endpoint test, the replay step below supplies the database and
      # deselects this test.
      - name: LogQL categorize-labels capture drift leg (issue #463)
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13101"
        run: |
          cargo test -p pulsus-server --test categorize_labels_differential -- \
            --test-threads=1 --exact the_committed_capture_matches_the_live_reference

      - name: LogQL categorize-labels reference diagnostics (on failure only)
        if: failure()
        run: docker logs pulsus-logql-diff-463 2>&1 || true

      - name: Stop the #463 reference
        if: always()
        run: docker rm -f pulsus-logql-diff-463 || true

      - name: LogQL corpus replay leg (issue #352, nightly)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          PULSUSDB_LOGQL_DIFF_URL: "http://localhost:13100"
        run: cargo test -p pulsus-read --test logqltest_replay

      # Issue #291. The differential legs above probe this container, and
      # when one of them fails we have never once looked at what the
      # REFERENCE said — `docker logs` ran only inside the readiness step,
      # so a leg failing produced no reference log at all. Curl exit codes
      # 28, 56 and 52 were seen on the same query and looked like three
      # separate faults; they are ONE — the reference's own 30 s
      # `server.http-write-timeout` closing the connection
      # (`dskit/server/server.go:217 @ v3.7.4`). This step stays because
      # it is how the next such question gets answered from the
      # reference's own account rather than by inference: four rounds went
      # on inferring from the symptom before anyone read the log.
      #
      # `if: failure()` so it costs nothing on a green run, and BEFORE the
      # stop step below, which would otherwise delete the evidence.
      - name: LogQL reference diagnostics (on failure only)
        if: failure()
        run: |
          echo '--- docker inspect: was it killed, did it exit, did it restart?'
          docker inspect pulsus-logql-diff \
            --format 'OOMKilled={{.State.OOMKilled}} Status={{.State.Status}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}} FinishedAt={{.State.FinishedAt}}' || true
          echo '--- docker stats (one sample)'
          docker stats --no-stream pulsus-logql-diff || true
          echo '--- loki log (whole, not tailed: the interesting line is not always last)'
          docker logs pulsus-logql-diff 2>&1 || true

      - name: Stop LogQL differential oracle
        if: always()
        run: docker rm -f pulsus-logql-diff || true

      # Issue #43: multi-endpoint connection spreading + transport-failure
      # failover on ONE node — both SHARD endpoints point at this job's
      # 19123 server (spreading observable via per-endpoint selection
      # counts), and the failover case adds a dead port to prove demotion.
      # The cross-node proof runs on the schema-it-cluster leg below.
      - name: Connection spreading + failover (single-node)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_SHARD1_HOST: "localhost"
          PULSUS_TEST_CH_SHARD1_HTTP_PORT: "19123"
          PULSUS_TEST_CH_SHARD2_HOST: "localhost"
          PULSUS_TEST_CH_SHARD2_HTTP_PORT: "19123"
        run: cargo test -p pulsus-clickhouse --test live_spreading

      # Issue #16, docs/schemas.md §9's two-tier model, Tier 1: the
      # scale-invariant system.query_log ratio gate for the logs read path
      # (CI-scale corpus). Includes issue #261's /detected_labels fan-in
      # identity: the aggregation returns one row per distinct KEY at any
      # value cardinality. Reuses this job's ClickHouse 26.3 container.
      - name: LogQL query_log ratio gate (Tier 1)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test query_log_gates

      # Issue #35 (full-shape parse bound): the live regression witness —
      # a >256 KiB rendered stage2/sample_fetch_multi SQL text fails to
      # parse under ClickHouse's server-default max_query_size and
      # succeeds once the raised product setting is applied. Reuses this
      # job's ClickHouse 26.3 container.
      - name: Query-text admission live witness (Tier 1)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-read --test query_text_cap_live

      # Issue #16 plan amendment: licenses the direct RowBinary bulk-load
      # shortcut `xtask bench logs-read`'s dataset generator uses for the
      # CI-scale/Tier-2 corpora, by proving it is byte-identical to the
      # product OTLP ingest path against hand-derived golden fixtures.
      - name: Ingest fidelity gate (product ingest vs. bulk RowBinary)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test ingest_fidelity

      # Issue #171 (M7-C3): log-pattern ingest fidelity — the same log lines
      # via OTLP and Loki-push land byte-identical hand-derived `log_patterns`
      # rows, and a re-admitted batch sums counts at `log_metrics` parity
      # (the documented best-effort-approximate-under-re-send semantics).
      - name: Log patterns ingest fidelity gate
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test log_patterns_fidelity

      # Issue #54 AC5: the OTLP traces round-trip — POST /v1/traces ->
      # TraceWriter (sync) -> exact count()s on both writer-written trace
      # tables, plus a live payload/FixedString wire-encoding read-back.
      # Reuses this job's ClickHouse 26.3 container.
      - name: Traces ingest round-trip (exact counts)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test trace_ingest_roundtrip

      # Issue #270: OTLP/JSON metrics ingest must store the CORRECTLY ROUNDED
      # f64 — POST /v1/metrics (application/json) -> decode_json -> parse ->
      # MetricWriter (sync) -> ClickHouse, read back as
      # reinterpretAsUInt64(value). The literals are chosen so serde_json's
      # default parser and str::parse disagree by 1 ULP, so this step fails if
      # the workspace `float_roundtrip` feature is ever dropped.
      # Reuses this job's ClickHouse 26.3 container.
      - name: OTLP/JSON metrics ingest stores nearest-representable f64 bits
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test metric_ingest_float_roundtrip

      # Issue #75: the Zipkin v2 JSON ingest round-trip — ingest_zipkin ->
      # zipkin::to_otlp -> otlp_traces::parse -> TraceWriter (sync) ->
      # ClickHouse. Proves fingerprint identity (Zipkin summary columns
      # byte-identical to the equivalent OTLP ingest) and shared-span
      # storage (a shared RPC span stores both the SERVER and CLIENT sides).
      # Reuses this job's ClickHouse 26.3 container.
      - name: Zipkin v2 JSON ingest round-trip (fingerprint identity + shared span)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test zipkin_ingest_roundtrip

      # Issue #120 (M7-A4): the native-histogram write path — MetricWriter ->
      # metric_hist_samples. Deciding ClickHouse-NaN gate (finite/stale-NaN/
      # absent-NaN `sum` bit patterns survive Float64 RowBinary round-trip
      # distinctly — also the first live proof of the landed float-stale
      # assumption), an OTLP parse(Native) -> writer -> SELECT absolute-count
      # round-trip incl. an internal zero bucket, and the value_type
      # discriminator mask (a cross-request float+histogram at one series
      # registers both metric_series rows, groupBitOr == 3). Reuses this
      # job's ClickHouse 26.3 container.
      - name: Native histogram writer round-trip (NaN gate + value_type)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test live_metric_hist_writer

      # Issue #140: remote-write native-histogram ingest — a real snappy
      # prompb body with a GAUGE-hint and an UNKNOWN-hint integer native
      # histogram through ingest_remote_write (sync) -> MetricWriter ->
      # ClickHouse: counter_reset_hint lands 3 and 0 respectively, the
      # stored row decodes to a Gauge FloatHistogram, and the
      # histograms-only series register value_type = 1 metric_series rows.
      # Reuses this job's ClickHouse 26.3 container.
      - name: Remote-write gauge-hint native histogram (counter_reset_hint e2e)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test live_remote_write_hist

      # Issue #134: the log_streams registration-backfill live failure
      # injection — L1 "lost registration" (first streams insert swallowed
      # with a deterministic error; the backfill heals it and the
      # stage-1-shaped query resolves the fingerprint in the sample's
      # month) and L2 "false Poisoned" (the first insert genuinely lands;
      # the backfill's duplicate re-insert provably occurs and collapses
      # to one row on a FINAL read — no inflation). Reuses this job's
      # ClickHouse 26.3 container.
      - name: Log stream registration backfill (live L1/L2 failure injection)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test live_log_stream_backfill

      # Issue #139: the metric registration-backfill live failure
      # injection — L-M1 (first metric_series insert swallowed; the
      # sample is visible while the registration is absent, then the
      # backfill heals it and the LIMIT 1 BY lookup is byte-identical
      # across a forced duplicate re-insert) and L-M2 (metric_metadata
      # "false Poisoned": the backfill's genuine duplicate plus a stale
      # re-insert both collapse to one FINAL row whose survivor is the
      # max-updated_ns descriptor). Reuses this job's ClickHouse 26.3
      # container.
      - name: Metric registration backfill (live L-M1/L-M2 failure injection)
        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-write --test live_metric_registration_backfill

      # Issue #139: the trace_attrs_idx registration-backfill live
      # failure injection — L-T1 (attrs insert swallowed while the span
      # commits: the span is fetchable by trace_id but the index probe
      # finds nothing; after the heal the primary-key probe returns the
      # trace_id, the span matches, and a forced duplicate collapses to
      # FINAL count 1). The TraceQL-executor end-to-end proof is the
      # #167 step below. Reuses this job's ClickHouse 26.3 container.
