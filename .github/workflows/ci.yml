  # Issue #843 part 3: the required check `schema-it-promql`. It passes only
  # when all three PromQL jobs above passed, and fails when any failed, was
  # cancelled or was skipped. P1 runs the rollup suite without its two 8-day
  # levels, beside the light suites; P2 the 8-day levels, then pushed rate;
  # P3 the read cache suite.
  schema-it-promql:
    if: always()
    needs: [schema-it-promql-p1, schema-it-promql-p2, schema-it-promql-p3]
    runs-on: ubuntu-latest
    steps:
      - name: All three PromQL jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "PromQL jobs: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done

  schema-it-tiering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Issue #743 part A: one ClickHouse with a cold volume on a local
      # object store, at compose.yaml's addresses so storage.xml serves both.
      # The second bucket request makes a rerun pass when the bucket exists.
      - name: Start the object store and ClickHouse 26.8
        run: |
          docker network create --subnet 172.28.0.0/24 pulsus-schema-it-cluster
          docker run -d --name pulsus-store-it --network pulsus-schema-it-cluster --ip 172.28.0.30 \
            -p 19900:9000 -e RUSTFS_ACCESS_KEY=pulsus-ci -e RUSTFS_SECRET_KEY=pulsus-ci-secret \
            docker.io/rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          sign='--aws-sigv4 aws:amz:us-east-1:s3 --user pulsus-ci:pulsus-ci-secret'
          ok=0
          for _ in $(seq 1 30); do
            # shellcheck disable=SC2086
            if curl -sS --fail-with-body $sign -X PUT http://127.0.0.1:19900/pulsus-ci -o /dev/null ||
               curl -sS --fail-with-body $sign "http://127.0.0.1:19900/pulsus-ci?list-type=2" -o /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          [ "$ok" = 1 ]
          docker run -d --name pulsus-ch-tiering-it --network pulsus-schema-it-cluster --ip 172.28.0.11 \
            -p 19123:8123 -p 19000:9000 \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/users.d/network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/shard1/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro \
            clickhouse/clickhouse-server@sha256:d3fd302416d9523d5d64239d5713d1c16c20ecea2045ac70d7e941b376cb266e
          for _ in $(seq 1 30); do
            curl -sf http://localhost:19123/ping && break
            sleep 1
          done

