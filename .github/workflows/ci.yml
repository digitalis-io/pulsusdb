        env:
          PULSUS_TEST_CLICKHOUSE: "1"
          PULSUS_TEST_CH_HTTP_PORT: "19123"
        run: cargo test -p pulsus-schema --test live_tiering

  # Issue #643: see `schema-it-logql`.
  schema-it-traceql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Issue #87: pinned nextest (same pin as the `ci` job) for the
      # API-suite steps' structured output below.
      - name: Install cargo-nextest (pinned)
        run: curl -LsSf https://get.nexte.st/0.9.140/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # Pinned by digest rather than by the floating `26.8` tag, the way the
      # reference images below already are: that tag moves to each new LTS
      # patch, so any branch can go red with no commit behind it. This digest
      # is clickhouse-server 26.8.21.10, the supported floor, read from the
      # registry on 2026-10-09 (issue #624, part 3d).
      # The two compose files under `ci/` carry the same digest and the
      # matching clickhouse-keeper one; this comment is the reason for all
      # nine references. The object store's image (issue #743 part A) is
      # pinned by digest too, in `ci/clickhouse-cluster/compose.yaml` and the
      # `schema-it-tiering` job.
      #
      # The 24.8 start further down is deliberately left on its tag: it is
      # the negative test that the version floor is enforced, so what it
      # needs is a server below the floor, not a reproducible one.
      - name: Start ClickHouse 26.8
        run: |
          docker run -d --name pulsus-ch-schema-it -p 19123:8123 -p 19000:9000 \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/users.d/network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/shard1/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro \
            clickhouse/clickhouse-server@sha256:d3fd302416d9523d5d64239d5713d1c16c20ecea2045ac70d7e941b376cb266e
          for _ in $(seq 1 30); do
            curl -sf http://localhost:19123/ping && break
            sleep 1
          done

      # Issue #180/#185 (M7-TQ1/TQ6): the black-box TraceQL differential
      # oracle. ONE UNMODIFIED, digest-pinned grafana/tempo v3.0.2 serves
      # BOTH the syntax leg (observes only HTTP status) and the compare()
      # VALUE leg (issue #185/#189). The augmented `tempo-compare.yaml`
      # config adds the OTLP HTTP receiver (:4318) + the local-blocks
      # metrics processor with aggressive ingest flush so freshly-pushed
      # spans become compare()-queryable within the test's bounded poll —
      # without affecting the syntax leg. No Tempo source is copied. The
      # hermetic `ci` job runs both tests with their gates off, skipping.
      - name: Start Tempo v3.0.2 (differential oracle)
        run: |
          docker run -d --name pulsus-tempo-diff -p 13200:3200 -p 4318:4318 \
            -v "$GITHUB_WORKSPACE"/ci/tempo/tempo-compare.yaml:/etc/tempo/tempo.yaml:ro \
            grafana/tempo@sha256:aa8df8d069f77b82e978464daf55169bb8d135852ad58700aa96880653c3d8f7 \
            -config.file=/etc/tempo/tempo.yaml
          for _ in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:13200/ready)" = "200" ] && break
            sleep 1
          done
          curl -sf http://localhost:13200/ready

      # Issue #479: the matched-span PROJECTION differential, ENFORCED
      # (non-skipped). Pushes ONE OTLP/JSON body to its own instance's OTLP
      # receiver and decodes those same bytes through our own ingest
      # parser, then compares, per matched span, the multiset of projected
      # attribute keys and the `name`-present flag over a 42-case registry.
      #
      # ITS OWN INSTANCE, not the shared `pulsus-tempo-diff` above (code
      # review wave 1): this corpus's statusMessage / service / root names
      # enter the compare() leg's top-N, and the resulting failure surfaces
      # in THAT suite as an ordinary-looking value mismatch against the
      # reference. The suite refuses to run against an instance holding any
      # other trace, and a hermetic test in the same file fails if any
      # other leg is ever pointed at these two endpoints.
      #
      # FAIL-CLOSED: all three gates go through pulsus_testkit's require_*
      # guards, so dropping this env block panics rather than reporting
      # green.
      - name: Start Tempo v3.0.2 (matched-span projection oracle)
        run: |
          docker run -d --name pulsus-tempo-479 -p 13480:3200 -p 14480:4318 \
            -v "$GITHUB_WORKSPACE"/ci/tempo/tempo-compare.yaml:/etc/tempo/tempo.yaml:ro \
            grafana/tempo@sha256:aa8df8d069f77b82e978464daf55169bb8d135852ad58700aa96880653c3d8f7 \
            -config.file=/etc/tempo/tempo.yaml
          for _ in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:13480/ready)" = "200" ] && break
            sleep 1
          done
          curl -sf http://localhost:13480/ready

      # Issue #478: the tag-values oracle leg. TWO fresh reference
      # containers, and the reason is measured rather than a preference:
      # on this pinned build the tag-value time filtering is
      # BLOCK-granular, not span-granular — two corpora pushed 120 s apart
      # were both returned by a window covering only the later one — so a
      # window cannot separate two corpora inside one instance. The
      # #476 sections therefore replay against their own container, with
      # their own corpus, exactly as they were captured; this plan's
      # sections replay against the other in the order they were captured.
      # Neither may be the shared `pulsus-tempo-diff` above, which by this
      # point in the job holds several other suites' spans. Needs no
      # ClickHouse. FAIL-CLOSED: all four endpoint gates panic if this env
      # block is dropped (the #320 class).
      - name: Start Tempo v3.0.2 (tag-values oracle, two instances)
        run: |
          start_one() {
            docker run -d --name "$1" -p "$2":3200 -p "$3":4318 \
              -v "$GITHUB_WORKSPACE"/ci/tempo/tempo-compare.yaml:/etc/tempo/tempo.yaml:ro \
              grafana/tempo@sha256:aa8df8d069f77b82e978464daf55169bb8d135852ad58700aa96880653c3d8f7 \
              -config.file=/etc/tempo/tempo.yaml
          }
          start_one pulsus-tempo-478a 13478 14478
          start_one pulsus-tempo-478b 13479 14479
          for port in 13478 13479; do
            for _ in $(seq 1 40); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$port/ready)" = "200" ] && break
              sleep 1
            done
            curl -sf "http://localhost:$port/ready"
          done

      # Issue #843 part 3: this job's live suites, 4 at a time, from
      # ci/suites/schema-it-traceql.tsv; the format and the rules are in
      # ci/live-suites.sh.
      - name: Live suites (parallel)
        run: ci/live-suites.sh ci/suites/schema-it-traceql.tsv

      - name: Stop Tempo matched-span projection oracle
        if: always()
        run: docker rm -f pulsus-tempo-479 || true

      - name: Stop Tempo tag-values oracles
        if: always()
        run: docker rm -f pulsus-tempo-478a pulsus-tempo-478b || true

      - name: Stop Tempo differential oracle
        if: always()
        run: docker rm -f pulsus-tempo-diff || true

      - name: Build pulsusdb
        run: cargo build -p pulsus-server --bin pulsusdb

      # The schema is `schema/schema.sql` and `schema/schema.sh` applies it.
      # The binary creates none, so this is the step that proves a fresh
      # ClickHouse ends up with the whole schema.
      #
      # The script drops the database and builds it fresh every run, so
      # running it twice and comparing the catalogue byte for byte is a
      # determinism check rather than an idempotency one.
      #
      # The file's own shape — no single-brace token, no stray semicolon,
      # every replication path naming its own table, the script and the
      # crate rendering the same text — is held by
      # `crates/pulsus-schema/tests/schema_file.rs`, which the `ci` job runs.
      - name: "schema.sh: builds the whole schema, single-node, twice identically"
        env:
          CLICKHOUSE_SERVER: localhost
          CLICKHOUSE_HTTP_PORT: "19123"
          CLICKHOUSE_DB: pulsus
          PULSUS_RETENTION_DAYS: "7"
        run: |
          catalogue() {
            curl -sS --fail-with-body 'http://localhost:19123/' --data-binary \
              "SELECT name, create_table_query FROM system.tables \
               WHERE database = 'pulsus' ORDER BY name FORMAT TSV"
          }
          schema/schema.sh
          catalogue > /tmp/schema-first.tsv
          objects=$(wc -l < /tmp/schema-first.tsv)
          if [ "$objects" -ne 70 ]; then
            echo "::error::expected 70 objects in the single-node schema, got $objects"
            cut -f1 /tmp/schema-first.tsv
            exit 1
          fi
          schema/schema.sh
          catalogue > /tmp/schema-second.tsv
          if ! diff -u /tmp/schema-first.tsv /tmp/schema-second.tsv; then
            echo "::error::a second run of schema.sh produced a different schema"
            exit 1
          fi

      - name: Stop ClickHouse 26.8
        if: always()
        run: docker rm -f pulsus-ch-schema-it

      - name: Start ClickHouse 24.8 (below the minimum supported version)
        run: |
          docker run -d --name pulsus-ch-schema-it-old -p 19124:8123 -p 19001:9000 \
            -v "$GITHUB_WORKSPACE"/ci/clickhouse-cluster/users.d/network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro \
            clickhouse/clickhouse-server:24.8
          for _ in $(seq 1 30); do
            curl -sf http://localhost:19124/ping && break
            sleep 1
          done

      - name: "schema.sh refuses ClickHouse < 26.8 with a clear error"
        env:
          CLICKHOUSE_SERVER: localhost
          CLICKHOUSE_HTTP_PORT: "19124"
          CLICKHOUSE_DB: pulsus
          PULSUS_RETENTION_DAYS: "7"
        run: |
          set +e
          output=$(schema/schema.sh 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::expected a nonzero exit refusing ClickHouse < 26.8, got 0"
            exit 1
          fi
          if ! echo "$output" | grep -qi "26.8"; then
            echo "::error::refusal message did not name the minimum supported version (26.8)"
            exit 1
          fi

      - name: Stop ClickHouse 24.8
        if: always()
        run: docker rm -f pulsus-ch-schema-it-old

      # Issue #87: per-suite results table (plus the api_conformance
      # matrix dimensions) on every run, pass or fail. The summarizer
      # never fails a green run — generation problems are warnings only.
      - name: Write test results summary
        if: always()
        run: ci/test-summary.sh render

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}
          path: target/test-summary/
          if-no-files-found: ignore

  # Issue #746 part E: a cluster built from the setup form's own files —
  # 4 servers in 2 shards of 2, 3 Keepers, TLS on every hop, the object
  # store — set up by following the generated setup.md, step by step.
  setup-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build PulsusDB and the setup bundle command
        run: cargo build -p pulsus-server -p xtask

      - name: "Setup form: build the cluster from its files and follow its steps"
        run: RT=docker sh ci/setup-cluster/run.sh

  # Issue #5: the 2-shard + Keeper cluster variant — Replicated engines,
  # `_dist` write/read-back, and the live sharding-identity assertion
  # (docs/schemas.md §7). Fixture at ci/clickhouse-cluster/compose.yaml.
  # Issue #843 part 2: the `schema-it-cluster` suites in three jobs, each
  # on its own cluster; this one runs the nested-set, tenant-rows and grouped reads
  # and the two-node connection suites.
  schema-it-cluster-c1:
    runs-on: ubuntu-latest
    steps:
      # Issue #602 part 3b-1: the runner's size, so a load-bound case such as
      # `the_job_keeps_up_under_steady_ingest` can be read against it.
      - name: Runner size
        run: |
          nproc
          free -g

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start the 2-shard cluster
        run: docker compose -f ci/clickhouse-cluster/compose.yaml up -d

      - name: Wait for cluster health
        run: |
          for _ in $(seq 1 60); do
            h1=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard1-it 2>/dev/null || echo starting)
            h1b=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard1b-it 2>/dev/null || echo starting)
            h2=$(docker inspect -f '{{.State.Health.Status}}' pulsus-ch-shard2-it 2>/dev/null || echo starting)
            hk=$(docker inspect -f '{{.State.Health.Status}}' pulsus-keeper-it 2>/dev/null || echo starting)
            if [ "$h1" = healthy ] && [ "$h1b" = healthy ] && [ "$h2" = healthy ] && [ "$hk" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::cluster did not become healthy in time"
          docker ps -a
          exit 1

      # Issue #743 part A: the bucket `config.d/storage.xml`'s cold disk
      # writes to. The second request makes a rerun pass when it exists.
      - name: Create the object-store bucket
        run: |
          sign='--aws-sigv4 aws:amz:us-east-1:s3 --user pulsus-ci:pulsus-ci-secret'
          ok=0
          for _ in $(seq 1 30); do
            # shellcheck disable=SC2086
            if curl -sS --fail-with-body $sign -X PUT http://127.0.0.1:19900/pulsus-ci -o /dev/null ||
               curl -sS --fail-with-body $sign "http://127.0.0.1:19900/pulsus-ci?list-type=2" -o /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          [ "$ok" = 1 ]

      # The clustered half of `schema/schema.sh`, created rather than
      # rendered. **This is the only leg that can tell a correct replication
      # path from the silently broken one**: a path whose `{shard}` macro was
      # substituted away reaches the same validation point as a correct one
      # on a single node, and the difference only shows against a keeper —
      # every shard joins one replica set. So the check is not "the DDL
      # applied" but what the macros resolved to, read back from
      # `system.replicas` per shard.
      - name: "schema.sh: builds the clustered schema on both shards"
        env:
          CLICKHOUSE_SERVER: localhost
          CLICKHOUSE_HTTP_PORT: "18123"
          CLICKHOUSE_DB: pulsus
          PULSUS_RETENTION_DAYS: "7"
          PULSUS_CLUSTER: pulsus_test_cluster
        run: |
          ask() { curl -sS --fail-with-body "http://localhost:$1/" --data-binary "$2"; }
          schema/schema.sh

          catalogue() {
            ask "$1" "SELECT name, create_table_query FROM system.tables \
                      WHERE database = 'pulsus' ORDER BY name FORMAT TSV"
          }
          catalogue 18123 > /tmp/cluster-shard1.tsv
          catalogue 13123 > /tmp/cluster-shard1b.tsv
          catalogue 28123 > /tmp/cluster-shard2.tsv
          objects=$(wc -l < /tmp/cluster-shard1.tsv)
          if [ "$objects" -ne 95 ]; then
            echo "::error::expected 95 objects in the clustered schema, got $objects"
            cut -f1 /tmp/cluster-shard1.tsv
            exit 1
          fi
          if ! diff -u /tmp/cluster-shard1.tsv /tmp/cluster-shard2.tsv; then
            echo "::error::ON CLUSTER did not land the identical DDL on both shards"
            exit 1
          fi
          if ! diff -u /tmp/cluster-shard1.tsv /tmp/cluster-shard1b.tsv; then
            echo "::error::ON CLUSTER did not land the identical DDL on shard 1's second replica"
            exit 1
          fi

          # Per-shard replica sets must be per shard: `{shard}` resolved to
          # this node's own macro, so shard 1's paths say /1/ and shard 2's
          # say /2/. Shard 1 has two replicas (issue #599 part B), so its
          # 27 per-shard tables hold two and shard 2's hold one. The eight
          # cluster-wide tables take /all/ and hold all three nodes. A
          # substituted-away macro collapses the first group onto one path
          # with three replicas, which this catches.
          paths() {
            ask "$1" "SELECT countIf(zookeeper_path LIKE '/clickhouse/tables/$2/%'), \
                             countIf(zookeeper_path LIKE '/clickhouse/tables/all/%'), \
                             countIf(total_replicas = 1), countIf(total_replicas = 2), \
                             countIf(total_replicas = 3) \
                      FROM system.replicas WHERE database = 'pulsus' FORMAT TSV"
          }
          for pair in "18123 1 27_8_0_27_8" "13123 1 27_8_0_27_8" "28123 2 27_8_27_0_8"; do
            set -- $pair
