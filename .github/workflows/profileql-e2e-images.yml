# Issue #832: builds and publishes the two images the profiles end-to-end
# scenario runs, so a CI run fetches nothing from a plugin catalogue or a
# package registry:
#   deploy/e2e/profileql/frontend.Dockerfile -> profileql-e2e-frontend
#   deploy/e2e/profileql/browser.Dockerfile  -> profileql-e2e-browser
#
# Run by hand only. The job runs in the `ghcr-publish` environment, which
# deploys from `main` only after its reviewer approves, and logs in with that
# environment's secret; the workflow token asks for no package permission.
# The last step prints the digest each push step returned; the e2e stack
# pins those digests. To update: change an ARG, or package.json and its lock,
# merge, run this on `main`, and pin the printed digests.
name: profileql-e2e-images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ghcr-publish
    steps:
      - name: Refuse without the environment's credential
        run: test -n "$TOKEN" || { echo "ghcr-publish environment or its GHCR_PUBLISH_TOKEN secret is missing"; exit 1; }
        env:
          TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PUBLISH_USER }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=ghcr.io/digitalis-io/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build and push the front end
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/e2e/profileql/frontend.Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/digitalis-io/profileql-e2e-frontend:13.3.1-13.0.10-3.2.0-13.4.2
          push: true

      - name: Build and push the browser
        id: browser
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/e2e/profileql/browser.Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/digitalis-io/profileql-e2e-browser:1.65.1
          push: true

      - name: Print the digests the push steps returned
        run: |
          echo "profileql-e2e-frontend ${FRONTEND_DIGEST}"
          echo "profileql-e2e-browser ${BROWSER_DIGEST}"
        env:
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          BROWSER_DIGEST: ${{ steps.browser.outputs.digest }}
