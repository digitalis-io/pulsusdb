# Reference Tempo config for the M4 traces differential (issue #60,
# `e2e/src/traces.rs`'s `traces_differential` scenario). Monolithic
# single-binary mode against local storage — KISS: no TLS, no auth, no
# DNS (the collector reaches the OTLP gRPC receiver by this service's
# static ipv4_address, `deploy/e2e/compose.single.yaml`).
#
# Pinned image: grafana/tempo:3.0.2 (see compose.single.yaml for the
# digest — tag AND digest, the prom/prometheus:v3.13.0 precedent;
# upgrades are deliberate future commits, never floating). Note for that
# future upgrade path: Tempo 3.x's single-binary mode has no `ingester`
# config block (the 2.x flush/complete-block tuning knobs are gone —
# `field ingester not found` on boot); recent traces are served from the
# live store, and the harness's bounded completeness pre-checks
# (trace-by-ID first, then search visibility) absorb the remaining
# ingest-to-searchable lag without fixed sleeps.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

# TraceQL METRICS need nothing on 3.0.2 beyond what is already above, and
# in particular no `metrics_generator` block — do not add one. The
# metrics-generator has no part in serving a TraceQL metrics query on this
# version, on EITHER of the two legs the query-frontend splits a range
# into at `query_backend_after`:
#
#   - RECENT slice — sent as `QueryModeRecent`
#     (`modules/frontend/metrics_query_range_sharder.go:334-362 @ v3.0.2`),
#     answered by the querier off the LIVE-STORE ring
#     (`modules/querier/querier_query_range.go:18,32 @ v3.0.2`); the
#     live-store is what the Metrics gRPC service is registered on
#     (`cmd/tempo/app/modules.go:719 @ v3.0.2`). This leg is what the A/B
#     below measured.
#   - BACKEND slice — block-selected on
#     `ReplicationFactor == MetricsGeneratorReplicationFactor`
#     (`modules/frontend/metrics_query_range_sharder.go:186-215 @ v3.0.2`).
#     The name is historical: on 3.0.2 that constant is an alias,
#     `LiveStoreReplicationFactor = MetricsGeneratorReplicationFactor = 1`
#     (`tempodb/backend/block_meta.go:135-137 @ v3.0.2`), and the only two
#     sites that ORIGINATE it on a block meta are the live-store
#     (`modules/livestore/instance.go:481 @ v3.0.2`) and the Kafka-fed
#     block-builder (`modules/blockbuilder/tenant_store.go:139 @ v3.0.2`),
#     which this single-binary config does not run. In `git grep -n
#     ReplicationFactor v3.0.2 -- '*.go'`, minus vendor, tests and
#     `.pb.go`, no third site ASSIGNS it on a block meta: every other hit
#     is the sharder predicate, the constants, compaction/WAL sites that
#     copy an input meta's value, blockselector/compactor sites that only
#     read it, a comment, or `pkg/ring/config.go:58` — a ring replication
#     factor, a different field. The generator writes no blocks at all:
#     v3.0.2's
#     `modules/generator/processor/` holds only hostinfo, servicegraphs,
#     spanmetrics, util (the local-blocks processor that used to write
#     them is gone), and grepping `modules/generator/` for
#     `CreateBlock|CompleteBlock|NewBlockMeta|BlockMeta{|wal.New|WriteBlock`
#     returns nothing. NOT usefully measured: the A/B's ±1 h window does
#     reach past the default 15 m `query_backend_after`
#     (`modules/frontend/config.go:123 @ v3.0.2`), but each arm ran in a
#     fresh container, so the older slice had no blocks to select and this
#     leg was only exercised empty. It rests on the source above.
#
# Both `/api/metrics/query_range` and the instant `/api/metrics/query`
# terminate in the same `newAsyncQueryRangeSharder`
# (`modules/frontend/frontend.go:208-233 @ v3.0.2` — the instant pipeline
# also runs `adjustEndWareNanos` and passes `instant=true`, but the
# sharder is the same one), so the two legs above are the whole story for
# both endpoints. Only `query_range` was measured.
#
# Configuring the generator anyway cannot change an answer, and costs log
# noise: a `processors: [local-blocks]` override is dropped as unknown
# before any processor is built
# (`modules/generator/validation/fields.go:19-25 @ v3.0.2` lists
# service-graphs / span-metrics{,-count,-latency,-size} / host-info only;
# `filterSupportedProcessors` discards the rest), and re-warned on the
# override watcher's 10 s `reloadPeriod` for as long as a generator
# instance exists (`modules/generator/instance.go:133-142,256-266 @
# v3.0.2`). The newer spellings from current Tempo docs are not in
# 3.0.2's structs at all and hard-fail its strict parser at boot:
# `ProcessorConfig` has only service_graphs / span_metrics / host_info
# (`modules/generator/config.go:151-155 @ v3.0.2`), so `local_blocks`
# gives `field local_blocks not found in type generator.ProcessorConfig`;
# `Config` has no `traces_storage` key either
# (`modules/generator/config.go:50-81 @ v3.0.2`), which fails the same way
# with its own message.
#
# With no `metrics_generator.storage.path`, 3.0.2 logs
# `msg="metrics-generator is not configured."` and puts an idle service in
# the generator module's place (`cmd/tempo/app/modules.go:294-306 @
# v3.0.2`). Neither query leg above reads that module.
#
# MEASURED (issue #252, 2026-08-05), because an earlier revision of this
# file asserted the opposite. Two arms of this file — with and without a
# `metrics_generator.storage.path` block — on `compose.single.yaml`'s image
# digest, mounted `tempo.yaml`/`otel-config.single.yaml` and static IPs,
# corpus pushed through the otel-collector's `otlp/tempo` gRPC exporter.
# Started with `podman run --network/--ip`, NOT `podman-compose`, which
# does not honour `ipv4_address` on this host; the compose process manager
# itself was not exercised. Two corpora — 20 spans of 300 ms, and the
# differential's own 24-trace/96-span CI corpus — and six query runs on
# each: five over a tight window at a 5 s step (`histogram_over_time`
# filtered and unfiltered, `rate`, `count_over_time` under
# `status = error`, `quantile_over_time`) and the filtered
# `histogram_over_time` again over ±1 h at a 60 s step. Polled every 5 s
# for ~235 s after ingest.
#
# Over the settled polls (t >= 60 s), for all six runs on both corpora,
# the two arms produced the same SET of answers and the same final answer
# — same series counts, same `__bucket` maps, same rate/count totals, same
# quantile bits — excluding the served grid's right-edge timestamp, which
# tracks wall clock and so differs between arms run at different times.
# The five 5 s-step runs each settle on ONE answer; the 60 s run passes
# through four as its ±1 h window's right edge advances, the same four in
# both arms. The no-block arm's Tempo log carries the "not configured"
# warning above, so the arms really did differ.
#
# What DOES delay a first non-empty answer is the step, not this key. At
# the 5 s step every query that had data filled one poll after ingest:
# 10.1 s / 10.1 s (with block / without) on the 20-span corpus, 10.2 s /
# 10.1 s on the CI corpus. At the 60 s step: 50.4 s / 40.3 s on the
# 20-span corpus, 15.2 s / 15.1 s on the CI corpus — the no-block arm was
# never the slower one. A 60 s interval only reports once wall-clock
# passes its right edge, which is why the harness polls the reference
# (`e2e/src/traces.rs::assert_reference_metrics_positive_control`) rather
# than querying it once.
#
# No `live_store` flush tuning either, deliberately. The runs above used
# 3.0.2's defaults — `flush_check_period` 5 s, `max_trace_idle` 5 s,
# `max_block_duration` 30 s, `complete_block_timeout` 20 m
# (`modules/livestore/config.go:14,106-111 @ v3.0.2`). The control's pass
# condition is stricter than "non-empty": every cell present AND the grid
# served through the requested end. The closest proxy the A/B measured is
# its own 5 s-step run — same step and same tight-window shape — whose
# answer and served right edge both stopped moving 35.3 s after ingest in
# three of the four runs and 42.5 s in the fourth, then held for the
# remaining ~200 s, against a `completeness_poll_timeout` of 180 s (ci) /
# 600 s (full). `ci/tempo/tempo-compare.yaml` shortens the
# first three knobs (and lengthens `complete_block_timeout` to 30 m) for a
# different test's budget; this scenario does not need that, and if it
# ever did the control would time out naming the missing cells rather than
# pass on partial data.
#
# `ci/tempo/tempo-compare.yaml` carries the same architecture note from
# issue #185. Exact scope of that cross-reference: the revision of it on
# `main` has no `metrics_generator` block — the string occurs there only
# inside that note (`git show origin/main:ci/tempo/tempo-compare.yaml`) —
# and `compare_value_differential`, which asserts VALUES from
# `/api/metrics/query_range` against that config, runs non-skipped in
# `.github/workflows/ci.yml`'s schema-it job. Unmerged branches are NOT
# covered: a revision on `m7-tq6-185-closeout`, never merged, does carry a
# `metrics_generator.processor.local_blocks` block.
