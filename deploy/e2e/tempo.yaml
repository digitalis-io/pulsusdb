# Reference Tempo config for the M4 traces differential (issue #60,
# `e2e/src/traces.rs`'s `traces_differential` scenario). Monolithic
# single-binary mode against local storage — KISS: no TLS, no auth, no
# DNS (the collector reaches the OTLP gRPC receiver by this service's
# static ipv4_address, `deploy/e2e/compose.single.yaml`).
#
# Pinned image: grafana/tempo:3.0.2 (see compose.single.yaml for the
# digest — tag AND digest, the prom/prometheus:v3.13.0 precedent;
# upgrades are deliberate future commits, never floating). Note for that
# future upgrade path: Tempo 3.x's single-binary mode has no `ingester`
# config block — adding one makes the process exit 1 before serving, with
#   failed parsing config: failed to parse configFile /etc/tempo.yaml:
#   yaml: unmarshal errors:
#     line 52: field ingester not found in type app.Config
# (measured 2026-08-11: this file plus `ingester: {max_block_duration: 5m}`
# appended, run against the pinned digest below — `podman run --rm -v
# <cfg>:/etc/tempo.yaml:ro grafana/tempo:3.0.2@sha256:cda87c21…
# -config.file=/etc/tempo.yaml`). The 2.x flush and
# complete-block tuning knobs were not removed, they moved — they now sit
# under the root `live_store` key (`cmd/tempo/app/config.go:72` @ v3.0.2,
# `0c4b926d`), which declares `flush_check_period`, `max_trace_idle`,
# `max_trace_live`, `max_block_duration` and `complete_block_timeout`
# (`modules/livestore/config.go:35,47-53`). This file overrides none of
# them, so the defaults apply: `flush_check_period` and `max_trace_idle`
# are both 5s (`modules/livestore/config.go:106,109`). The trace-by-ID
# gate's reference-side re-ask was sized against those two defaults —
# `TEMPO_CUT_RETRY_CEILING` in `e2e/src/traces.rs`. Note that it is a
# fixed constant CHOSEN to match them as they stand today; it does not
# read this file and will not follow an override added here. If you set
# either knob below, re-check that constant by hand.
#
# Recent traces are served from the live store, and the harness's bounded
# completeness pre-checks (trace-by-ID first, then search visibility)
# absorb the remaining ingest-to-searchable lag without fixed sleeps.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

# TraceQL metrics: do NOT add a `metrics_generator` block. At the pinned
# Tempo version above it does nothing for these queries. See issue #252
# for why.
