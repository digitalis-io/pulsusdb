# Reference log-query oracle config for the M6-09 LogQL-pipeline
# differential (`e2e/src/logs.rs`'s `logs_pipeline_differential`
# scenario). All-in-one single-binary mode against local filesystem
# storage — KISS: no TLS, no auth, no DNS (the collector reaches the OTLP
# endpoint by this service's static ipv4_address,
# deploy/e2e/compose.single.yaml).
#
# Pinned image: grafana/loki:3.4.2 (see compose.single.yaml for the
# digest — tag AND digest, the grafana/tempo:3.0.2 / prom/prometheus
# precedent; upgrades are deliberate future commits, never floating).
#
# THIS ORACLE IS v3.7.4's PREDECESSOR and disagrees with the pinned
# log-ingest reference (grafana/loki:3.7.4, .github/workflows/ci.yml) on
# empty-valued structured metadata: 3.4.2 KEEPS an empty attribute value,
# 3.7.4 and PulsusDB DROP it — measured on OTLP scope attributes, OTLP
# resource attributes and the Loki push path alike. Read
# docs/benchmarks/logs-differential-ledger.md
# `empty-value-oracle-version-skew`, close condition included, before
# adding ANY empty-valued input to the shared logs corpus; a hermetic
# guard refuses one today.
#
# The differential's stream-label-set equality rests on this file's
# limits_config (M6-09 plan v3 delta 3):
#   - `otlp_config` promotes the corpus's isolation attribute (`run_id`)
#     to an INDEX (stream) label; `service.name` is already promoted by
#     the default OTLP mapping (-> `service_name`). The corpus emits
#     exactly those two resource attributes and nothing else (no scope,
#     no severity, no record attributes), so neither store grows extra
#     stream labels or structured metadata.
#   - `discover_log_levels: false` — otherwise the oracle injects a
#     `detected_level` structured-metadata field per entry, which its
#     query results surface as an extra label and which PulsusDB
#     deliberately does not synthesize.
#
#     REVERSED 2026-08-30 (issue #483), and the setting is STILL off here.
#     Two separate facts, both of which a future reader needs:
#
#     (a) The product position above is reversed. PulsusDB now synthesizes
#     a `detected_level` pair on every log-ingest path by default, because
#     the field is not decoration: it is what makes level colouring in the
#     log view and the breakdown in the log-volume histogram work at all
#     for the ordinary push and OTLP shape, where the level lives in the
#     line body rather than in a stream label. The earlier decision was
#     made about stream-label-set equality in this differential harness and
#     did not have that consumer fact. The knob is
#     `PULSUS_DISCOVER_LOG_LEVELS`, default `true`.
#
#     (b) This harness keeps the setting off, on BOTH sides — the
#     `pulsusdb` service in `compose.single.yaml` and `compose.cluster.yaml`
#     sets `PULSUS_DISCOVER_LOG_LEVELS: "false"` to match. The reason is
#     not the old position: it is that the container pinned here is an
#     OLDER reference build whose level rule differs materially from the
#     build the rule was captured against — 9 allowed field names against
#     14, no normalization of a value taken from a stream label, no
#     in-place normalization of a pre-existing pair, and an unbounded
#     substring scan with a different precedence instead of an
#     earliest-word-bounded scan. Agreement on today's corpus would be a
#     coincidence, and a differential that agrees by coincidence goes red
#     one day for a reason that has nothing to do with our correctness.
#
#     What would have to be true to turn it on: this harness's reference
#     container is moved to the same build the case table was captured
#     from; `crates/pulsus-write/tests/fixtures/detected_level/
#     reference_cases.json` is re-captured against it and comes back
#     byte-identical; and the corpus expectations are regenerated to carry
#     a per-record `detected_level`. Until all three hold, enabling it
#     compares our implementation of one rule against a different rule.
#
#     The rule itself is proved against the pinned reference build by
#     `crates/pulsus-write/tests/detected_level_reference_cases.rs`.
#   - `split_queries_by_interval: 0` (issue #301, upheld by the owner
#     ruling of 2026-08-12 on issue #425) — the oracle must evaluate the
#     range query it was ASKED, not the step-aligned one its
#     query-frontend rewrites it into. PulsusDB is deliberately and
#     permanently start-anchored, so this setting is not a workaround
#     awaiting a fix; it is what makes the differential compare the two
#     engines rather than one engine against the other's request
#     rewriter. See the inline note below.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# v13 + TSDB: required for structured metadata / the OTLP endpoint.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  discover_log_levels: false
  # Issue #301, upheld by the owner ruling of 2026-08-12 on issue #425 —
  # take the query-FRONTEND's request rewrite out of the range
  # differential's path. This is a DELIBERATE, PERMANENT divergence, not
  # a workaround pending a fix: PulsusDB will not implement the
  # alignment, because it returns points outside the requested window
  # (ledger `range-step-grid-start-anchored`). Loki's metric splitter
  # (`pkg/querier/queryrange/splitters.go`, `metricQuerySplitter.split`,
  # v3.4.2 L242 / v3.7.4 L236) calls `alignStartEnd` UNCONDITIONALLY,
  # flooring the request `start` to a multiple of `step` and ceiling
  # `end` — even when the query yields a single split, and regardless of
  # `align_queries_with_step` (false here, and it governs a different
  # middleware). Its LogQL engine is start-anchored `{start + k·step}`,
  # like PulsusDB, so under the 1h default the reference answers a
  # DIFFERENT query than the one asked: an epoch-aligned grid that can
  # carry points outside the requested `[start, end]` (measured — see
  # docs/benchmarks/logs-differential-ledger.md `frontend-step-alignment`).
  # `0` is the only switch: `split_by_interval.go`'s `Do` returns
  # `h.next.Do` before the splitter runs. Measured blast radius: only the
  # five `metric_range` cases change; all 32 other shipped cases
  # (streams, instant, error) are byte-identical either way.
  split_queries_by_interval: 0
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - run_id

analytics:
  reporting_enabled: false
