{{/*
The Job that builds the schema (`initJob.enabled`, on by default).

**It is the only thing that creates schema.** The binary creates none, and
a serving pod whose database does not exist stays unready and says so. So
this is not an operator convenience any more: without it, or without the
script run by hand, nothing serves.

**`schema/schema.sh` drops the database and builds it fresh.** The serving
pods carry no ordering against it and need none — a pod that starts first
stays unready and retries until the schema is there.

**The name carries a digest of the schema parameters, and that is what makes
an upgrade work at all.** A Job's `spec.template` is immutable, so a release
whose Job is a plain resource cannot be upgraded once any value inside that
template changes: `helm upgrade` tries to patch it and the API server
refuses with `field is immutable` — measured, on the behavioural suite's
retention-days upgrade.

With the digest in the name, an upgrade that changes a schema parameter
renders a DIFFERENT Job, so Helm creates it and removes the old one instead
of patching. An upgrade that changes nothing the schema reads renders the
same name and nothing happens.

That means **a schema-parameter change rebuilds the database and discards
what it holds.** That is the cost this design states: there are no
migrations, and a schema change costs a drop and a rebuild. The parameters
with that property are the ones `pulsusdb.schemaEnv` renders.

A Helm hook would be the other shape and does not work here: `pre-install`
runs before the release's own ClickHouse exists, and `post-install` runs
after `--wait` has already given up waiting for pods that cannot be ready
without a schema.
*/}}
{{- if .Values.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s"
      (include "pulsusdb.componentFullname" (dict "root" . "suffix" "-init"))
      (include "pulsusdb.schemaEnv" . | sha256sum | trunc 8) }}
  labels:
    {{- include "pulsusdb.componentLabels" (dict "root" . "component" "init") | nindent 4 }}
spec:
  backoffLimit: {{ .Values.initJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "pulsusdb.componentLabels" (dict "root" . "component" "init") | nindent 8 }}
      annotations:
        {{- include "pulsusdb.checksums" $ | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "pulsusdb.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - {{- include "pulsusdb.container" (dict "root" . "mode" "init" "resources" .Values.initJob.resources) | nindent 10 }}
      volumes:
        {{- include "pulsusdb.volumes" . | nindent 8 }}
{{- end }}
